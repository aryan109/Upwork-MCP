<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time XML Visualizer | Upwork MCP</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        XML Visualizer
      </h1>
      <div id="live-status" class="live-badge">
        <span class="pulse-dot"></span>
        <span id="live-text">Live Sync Active</span>
      </div>
    </div>

    <div class="file-search">
      <input type="text" id="search-input" placeholder="Search XML files...">
    </div>

    <div class="file-list" id="file-list">
      <div style="padding: 1rem; color: var(--text-muted); font-size: 0.85rem;">Scanning XML files...</div>
    </div>
  </aside>

  <!-- Main Area -->
  <main id="main">
    <header class="topbar">
      <div class="current-file-info">
        <h2 id="current-filename">Select an XML file</h2>
        <p id="current-filemeta">Select a file from the sidebar to view rendered visualisations</p>
      </div>

      <div class="view-tabs">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="tree">Structured Tree</button>
        <button class="tab-btn" data-tab="raw">Raw XML</button>
      </div>
    </header>

    <div class="content-area" id="content-area">
      <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
        <h3>No XML File Selected</h3>
        <p style="margin-top: 0.5rem; font-size: 0.9rem;">Choose an XML file on the left sidebar to start exploring.</p>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
