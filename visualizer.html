<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upwork MCP XML Visualizer (Serverless Edition)</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: #1f2937;
      --bg-card-hover: #374151;
      --border-color: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #6366f1;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 320px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-color);
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      margin-top: 0.6rem;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .sidebar-actions {
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-color);
    }

    .btn-primary {
      background: #0369a1;
      border-color: #0284c7;
      color: #fff;
    }

    .btn-primary:hover {
      background: #0284c7;
    }

    .file-search {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .file-search input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .file-search input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .file-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0.75rem 0.75rem 0.25rem;
      font-weight: 700;
    }

    .file-item {
      display: flex;
      flex-direction: column;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background-color 0.15s;
    }

    .file-item:hover {
      background-color: var(--bg-card-hover);
    }

    .file-item.active {
      background-color: #1e3a8a;
      border-left: 3px solid var(--accent-color);
    }

    .file-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
    }

    /* Main Content Area */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-primary);
    }

    .top-header {
      padding: 1rem 1.75rem;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .file-info h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .file-path {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: monospace;
      margin-top: 2px;
    }

    .tab-bar {
      display: flex;
      gap: 0.5rem;
    }

    .tab-btn {
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background-color: var(--bg-card);
    }

    .tab-btn.active {
      color: var(--accent-color);
      background-color: var(--bg-card);
      border-color: var(--border-color);
    }

    .view-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.75rem;
    }

    /* Cards & Grids */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .stat-val {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .stat-val.accent { color: var(--accent-color); }
    .stat-val.success { color: var(--success); }
    .stat-val.warning { color: var(--warning); }

    .stat-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-done { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-todo { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-critical { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-high { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-medium { background: rgba(56, 189, 248, 0.2); color: var(--accent-color); border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-low { background: rgba(156, 163, 175, 0.2); color: var(--text-muted); border: 1px solid rgba(156, 163, 175, 0.4); }
    .badge-tag { background: rgba(99, 102, 241, 0.2); color: var(--info); border: 1px solid rgba(99, 102, 241, 0.4); }

    /* Task Board */
    .task-filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent-color);
      color: #0b0f19;
      font-weight: 700;
    }

    .task-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: all 0.15s;
    }

    .task-card.is-done {
      border-left: 4px solid var(--success);
    }

    .task-card.is-todo {
      border-left: 4px solid var(--warning);
    }

    .task-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.4rem;
    }

    .task-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .task-meta {
      display: flex;
      gap: 0.4rem;
    }

    .task-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .task-details {
      display: flex;
      gap: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border-color);
      padding-top: 0.5rem;
      margin-top: 0.5rem;
    }

    .task-details span strong {
      color: var(--text-main);
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .data-table th, .data-table td {
      padding: 0.6rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table th {
      background: var(--bg-secondary);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
    }

    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Collapsible Tree Explorer */
    .tree-node {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      margin-left: 1.25rem;
      border-left: 1px dotted var(--border-color);
      padding-left: 0.5rem;
    }

    .tree-node-header {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      cursor: pointer;
      user-select: none;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .tree-node-header:hover {
      background: var(--bg-card-hover);
    }

    .tree-toggle {
      font-size: 0.7rem;
      color: var(--text-muted);
      width: 12px;
      display: inline-block;
    }

    .tree-tag {
      color: #f43f5e;
      font-weight: 600;
    }

    .tree-attr {
      color: #38bdf8;
      font-size: 0.8rem;
    }

    .tree-val {
      color: #e2e8f0;
    }

    .tree-text {
      color: #34d399;
      margin-left: 0.5rem;
      word-break: break-word;
    }

    /* Raw Code Viewer */
    .raw-xml-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #e2e8f0;
      line-height: 1.6;
    }

    /* Drop Zone */
    #dropzone-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.85);
      border: 3px dashed var(--accent-color);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Fullscreen Dropzone Overlay -->
  <div id="dropzone-overlay">Drop any XML file to inspect instantly</div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>⚡ Upwork MCP Visualizer</h1>
      <div id="mode-badge" class="mode-badge">
        <span class="pulse-dot"></span>
        <span id="mode-text">Snapshot Mode (Zero Server)</span>
      </div>
    </div>

    <div class="sidebar-actions">
      <button id="btn-connect-folder" class="btn btn-primary" title="Connect local folder using File System Access API for 0-server live disk sync">
        🟢 Enable Live Disk Watch
      </button>
      <label class="btn" style="cursor: pointer;">
        📂 Open External XML
        <input type="file" id="file-input" accept=".xml" style="display: none;">
      </label>
    </div>

    <div class="file-search">
      <input type="text" id="search-input" placeholder="Search XML files...">
    </div>

    <div id="file-list" class="file-list"></div>
  </div>

  <!-- Main Content Area -->
  <div id="main-content">
    <div class="top-header">
      <div class="file-info">
        <h2 id="active-filename">Select a file</h2>
        <div id="active-filepath" class="file-path"></div>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="dashboard">📊 Dashboard</button>
        <button class="tab-btn" data-tab="tree">🌳 Interactive Tree</button>
        <button class="tab-btn" data-tab="raw">📝 Raw XML</button>
      </div>
    </div>

    <div id="view-container" class="view-container"></div>
  </div>

  <!-- Embedded Dataset -->

000/$1,500/$2,500 per month.</offer_ladder_summary>\n    <baseline snapshot=\"2026-10-04\">Top Rated; JSS 100%; $20K+ earned; 35 jobs; 395 hours; listed $120/hr vs visible $3\u201330/hr history; $2,172 in last 12 months; 0 proposals in 7 days; 0 profile views in 7 days; availability badge off; 110 Connects; 1 open invitation (2026-08-31); catalog = 2 OpenClaw + AI Launchpad Blueprint.</baseline>\n    <non_negotiables>\n      <rule id=\"NN1\">Human approval before any proposal submission (two explicit confirmations: submit, then confirm after preview).</rule>\n      <rule id=\"NN2\">Never auto-buy Connects; never boost above 10 Connects; never auto-reply to clients; never accept offers automatically.</rule>\n      <rule id=\"NN3\">No fabricated credentials, client names or results; placeholders and VERIFY LIVE tags instead.</rule>\n      <rule id=\"NN4\">Claims hygiene: no \"8 years\", no GxP/HIPAA/compliance absolutes, no \"enterprise-grade\", no guarantees.</rule>\n      <rule id=\"NN5\">OpenClaw is never in the storefront; MCP is a keyword, not the headline.</rule>\n      <rule id=\"NN6\">The MCP engine is never mentioned in client-facing text as Upwork automation.</rule>\n      <rule id=\"NN7\">State, logs and client data live outside the repo (%USERPROFILE%\\upwork_engine\\).</rule>\n      <rule id=\"NN8\">Every MCP call logged with input parameters and execution state; comprehensive try/except with classified incidents.</rule>\n      <rule id=\"NN9\">Deterministic rules live in versioned config (campaigns.json, scoring.json); agents never edit them at run time.</rule>\n      <rule id=\"NN10\">Reassess after 20\u201330 qualified proposals; one experiment at a time; one scoring block re-weighted per month.</rule>\n    </non_negotiables>\n  </summary>\n\n  <sources>\n    <source path=\"UPWORK_OVERHAUL_PLAN_v2_by_claude.xml\" role=\"master strategy; profile facts; market snapshot 2026-10-04\"/>\n    <source path=\"UPWORK_OVERHAUL_PLAN_by_claude.xml\" role=\"superseded v1\"/>\n    <source path=\"upwork_strategy_overhaul_by_Gemini.xml\" role=\"Enterprise AI Architect destination; milestone safeguards\"/>\n    <source path=\"UPWORK_MCP_DOCUMENTATION.md\" role=\"MCP tool catalog (claims 51 tools)\"/>\n    <source path=\"UPWORK_MCP_DOCUMENTATION.xml\" role=\"MCP tool schemas (lists 48 tools)\"/>\n    <source path=\"Upwork_plan_comparitive_analysis_chat_gpt_think.xml\" role=\"reviewer: 3 excellent/day, consultation $75\u2013100\"/>\n    <source path=\"Upwork_plan_comparitive_analysis_claude_opus_5_5_medium.xml\" role=\"reviewer: title length, idle contracts, rate 65\u201375, MCP doc inaccuracies\"/>\n    <source path=\"Upwork_plan_comparitive_analysis_gemini_flash.xml\" role=\"reviewer\"/>\n    <source path=\"Upwork_plan_comparitive_analysis_gpt_5_6_sol_medium.xml\" role=\"reviewer: weighted scoring, smart_search param mismatch, title\"/>\n    <source path=\"Upwork_plan_comparitive_analysis_grok4_7_high.xml\" role=\"reviewer\"/>\n    <source path=\"Upwork_plan_comparitive_analysis_Muse_spark_1_3_high.xml\" role=\"reviewer\"/>\n    <source path=\"UPWORK_STRATEGY_ANALYSIS_AND_MASTER_ACTION_PLAN.md\" role=\"synthesis\"/>\n    <source path=\"upwork_plan_consensus.html\" role=\"six-reviewer consensus (14 points)\"/>\n    <source path=\"Upwork Analysis Agent Data/\" role=\"reference autopilot export (Patrick H.): README, ARCHITECTURE, NOTION_SCHEMA, agent_instructions, skills_and_knowledge, databases, applied letters\"/>\n    <source path=\"project_development_logs.md\" role=\"decision history\"/>\n  </sources>\n\n  <package_map root=\"aryan_implementation/\">\n    <file path=\"00_README.md\" purpose=\"Map, reading order, ten-line plan, skill install, non-negotiables\" phases=\"P1 P2 P3 P4 P5 P6\"/>\n    <file path=\"ARYAN_IMPLEMENTATION_PLAN.xml\" purpose=\"This machine-readable plan map and living tracker\" phases=\"P1 P2 P3 P4 P5 P6\"/>\n    <file path=\"01_REFERENCE_IMPLEMENTATION_ANALYSIS.md\" purpose=\"Analysis of the reference aut /weekly_funnel_review.md\" purpose=\"Sunday review template\" phases=\"P5\"/>\n  </package_map>\n\n  <phases>\n\n    <!-- ===================== P1 STOREFRONT REBUILD ===================== -->\n    <phase id=\"P1\" name=\"Storefront rebuild\" goal=\"Reposition the profile, rate, catalog and settings so search traffic lands on a coherent buyer-centric storefront\" window=\"Day 0\u201324 (plus specialized profile B at Day 50\u201356)\" status=\"todo\">\n      <tasks>\n        <task id=\"P1-T01\" status=\"todo\" day=\"0\" owner=\"aryan\" priority=\"critical\">\n          <title>Confirm decisions in writing</title>\n          <description>Aryan confirms the title, $65 rate, ladder prices and the never-auto-submit rule; decision recorded in project_development_logs.md.</description>\n          <prerequisites/>\n          <tool>project_development_logs.md</tool>\n          <reference doc=\"02_MASTER_IMPLEMENTATION_PLAN.md\" section=\"0.5\"/>\n          <acceptance_criteria>Decision entry exists in the log.</acceptance_criteria>\n          <verify_live required=\"false\"/>\n          <rollback>None.</rollback>\n          <estimated_hours>0.5</estimated_hours>\n        </task>\n        <task id=\"P1-T02\" status=\"todo\" day=\"0\" owner=\"aryan\" priority=\"high\">\n          <title>Decide Freelancer Plus renewal</title>\n          <description>Decide whether to renew Freelancer Plus (100 Connects/month plus visibility).</description>\n          <prerequisites/>\n          <tool>Upwork UI: Membership</tool>\n          <reference doc=\"02_MASTER_IMPLEMENTATION_PLAN.md\" section=\"0.6\"/>\n          <acceptance_criteria>Decision logged.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-05\">Current Freelancer Plus price and Connects allowance.</verify_live>\n          <rollback>Cancel membership.</rollback>\n          <estimated_hours>0.25</estimated_hours>\n        </task>\n        <task id=\"P1-T03\" status=\"todo\" day=\"1\" owner=\"both\" priority=\"critical\">\n          <title>Live audit of exact profile numbers</title>\n          <description>Capture JSS, earnings, jobs, hours, Connects, badge, catalog, portfolio, invitation status and open contracts into skills/aryan-profile-facts.</description>\n          <prerequisites>P4-T01</prerequisites>\n          <tool>Upwork UI: Profile page; MCP get_profile(get), get_profile(connects_balance), get_freelancer_dashboard(check), list_contracts, list_freelancer_proposals(invitations)</tool>\n          <reference doc=\"skills/aryan-profile-facts/SKILL.md\" section=\"1\"/>\n          <acceptance_criteria>Facts file updated with date stamp; all VERIFY LIVE items in 03 resolved or listed.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-20 VL-21 VL-22\">Exact live numbers, displayed name, employment start.</verify_live>\n          <rollback>None.</rollback>\n          <estimated_hours>1.5</estimated_hours>\n        </task>\n        <task id=\"P1-T04\" status=\"todo\" day=\"2\" owner=\"aryan\" priority=\"critical\">\n          <title>Profile rewrite: title, overview, skills, rate</title>\n          <description>Set primary title, paste the overview after passing the claims-hygiene checklist, reorder 15 skills tags (drop Systems Engineering and Gemini), set rate to $65.</description>\n          <prerequisites>P1-T03 P1-T01</prerequisites>\n          <tool>Upwork UI: Profile edit</tool>\n          <reference doc=\"03_PROFILE_AND_STOREFRONT.md\" section=\"1, 2, 3, 3.1, 4\"/>\n          <acceptance_criteria>Saved; screenshot stored outside repo; checklist all ticked.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-01 VL-02 VL-03\">Title char limit (~70), overview limit (5,000), skills slots (15) and taxonomy labels.</verify_live>\n          <rollback>Previous overview saved to %USERPROFILE%\\upwork_engine\\backup\\profile_2026-10-04.md before edit; revert by paste; rate back to previous.</rollback>\n rkflow Setup Sprint</title>\n          <description>Create the three-tier Setup Sprint listing ($299/$599/$1,200) with description, tiers, requirements and FAQ; submit for review.</description>\n          <prerequisites>P1-T06</prerequisites>\n          <tool>Upwork UI: Project Catalog</tool>\n          <reference doc=\"03_PROFILE_AND_STOREFRONT.md\" section=\"6.1\"/>\n          <acceptance_criteria>Status \"under review\".</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-07 VL-08\">Catalog title limit, category path, max price, review time.</verify_live>\n          <rollback>Unpublish.</rollback>\n          <estimated_hours>1.5</estimated_hours>\n        </task>\n        <task id=\"P1-T08\" status=\"todo\" day=\"5\" owner=\"aryan\" priority=\"high\">\n          <title>Catalog Listing 2: AI Operations &amp; Automation Audit</title>\n          <description>Create the two-tier Audit listing ($750/$1,500) with description, tiers, requirements and FAQ; submit for review.</description>\n          <prerequisites>P1-T06</prerequisites>\n          <tool>Upwork UI: Project Catalog</tool>\n          <reference doc=\"03_PROFILE_AND_STOREFRONT.md\" section=\"6.2\"/>\n          <acceptance_criteria>Under review.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-07 VL-08\">Catalog limits.</verify_live>\n          <rollback>Unpublish.</rollback>\n          <estimated_hours>1</estimated_hours>\n        </task>\n        <task id=\"P1-T09\" status=\"todo\" day=\"10\" owner=\"aryan\" priority=\"medium\">\n          <title>Catalog listings approved; fix review notes</title>\n          <description>Check review status of Listings 1 and 2; address any reviewer notes.</description>\n          <prerequisites>P1-T07 P1-T08</prerequisites>\n          <tool>Upwork UI: Project Catalog</tool>\n          <reference doc=\"02_MASTER_IMPLEMENTATION_PLAN.md\" section=\"1 (Day 10)\"/>\n          <acceptance_criteria>Both listings live.</acceptance_criteria>\n          <verify_live required=\"false\"/>\n          <rollback>None.</rollback>\n          <estimated_hours>0.5</estimated_hours>\n        </task>\n        <task id=\"P1-T10\" status=\"todo\" day=\"13\" owner=\"both\" priority=\"low\">\n          <title>Write Listing 3 text (Done-For-You Implementation, next-step offer)</title>\n          <description>Draft the custom-quote implementation listing text; publish only if catalog price caps allow, otherwise keep as proposal/message offer.</description>\n          <prerequisites>P1-T09</prerequisites>\n          <tool>Upwork UI: Project Catalog</tool>\n          <reference doc=\"03_PROFILE_AND_STOREFRONT.md\" section=\"6.3\"/>\n          <acceptance_criteria>Draft complete.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-08\">Max catalog price.</verify_live>\n          <rollback>Do not publish.</rollback>\n          <estimated_hours>0.75</estimated_hours>\n        </task>\n        <task id=\"P1-T11\" status=\"todo\" day=\"19\" owner=\"both\" priority=\"medium\">\n          <title>Draft Specialized profile A: AI Agent &amp; Automation Development</title>\n          <description>Build-heavy specialized profile (agents, RAG, n8n, API, scraping).</description>\n          <prerequisites>P1-T04</prerequisites>\n          <tool>Upwork UI: Specialized profiles</tool>\n          <reference doc=\"03_PROFILE_AND_STOREFRONT.md\" section=\"5\"/>\n          <acceptance_criteria>Draft saved.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-10\">Specialized-profile limits.</verify_live>\n          <rollback>Delete draft.</rollback>\n          <estimated_hours>1</estimated_hours>\n        </task>\n        <task id=\"P1-T12\" status=\"todo\" day=\"24\" owner=\"aryan\" priority=\"medium\">\n          <title>Publish Specialized profile A</title>\n          <description>Publish the specialized profile drafted on Day 19.</description>\n          <prerequisites>P1-T11</prerequisites>\n          <tool>Upwork UI: Specialized profiles</tool>\n          <reference doc=\"02_MASTER_IMPLEMENTATION_PLAN.md\" section=\"1 (Day 24)\"/>\n          <acceptance_criteria>Live.</acceptance_criteria>\n          <verify_live required=\"false\"/>\n          <rollback>Unpublish.</rollback>\n          <estimated_hours>0.25</estimated_hours>\n        </task>\n        <task id=\"P1-T13\" status=\"todo\" day=\"50-56\" owner=\"both\" priority=\"low\">\n          <title>Specialized profile B: AI Training &amp; Coaching (conditional)</title>\n          <description>Publish only if training-cluster posts show at least 10% reply rate by Week 8.</description>\n          <prerequisites>P5-T05</prerequisites>\n          <tool>Upwork UI: Specialized profiles</tool>\n          <reference doc=\"02_MASTER_IMPLEMENTATION_PLAN.md\" section=\"2 (Week 8)\"/>\n          <acceptance_criteria>Live or explicitly dropped.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-10\">Specialized-profile limits.</verify_live>\n          <rollback>Unpublish.</rollback>\n          <estimated_hours>1</estimated_hours>\n        </task>\n      </tasks>\n    </phase>\n\n    <!-- ===================== P2 PROOF MACHINE ===================== -->\n    <phase id=\"P2\" name=\"Proof machine\" goal=\"Three case studies, a 2-minute demo video and delivery discipline that turns every contract into proof\" window=\"Day 0\u201370\" status=\"todo\">\n      <tasks>\n        <task id=\"P2-T01\" status=\"todo\" day=\"0\" owner=\"aryan\" priority=\"critical\">\n          <title>Fill aryan-profile-facts (proof inventory, permissions, numbers)</title>\n          <description>Replace every {{}} in sections 1\u20134 of the facts skill; set permission level per past contract and proof item; copy up to three verbatim client quotes.</description>\n          <prerequisites/>\n          <tool>skills/aryan-profile-facts/SKILL.md</tool>\n          <reference doc=\"skills/aryan-profile-facts/SKILL.md\" section=\"1\u20134\"/>\n          <acceptance_criteria>No {{}} left in sections 1\u20134; drafting skills no longer refuse.</acceptance_criteria>\n          <verify_live required=\"true\" registry_ref=\"VL-20 VL-21 VL-22 VL-23\">Numbers, names, contract count, permission to describe the enterprise client.</verify_live>\n          <rollback>None.</rollback>\n          <estimated_hours>2</estimated_hours>\n        </task>\n        <task id=\"P2-T02\" status=\"todo\" day=\"6\" owner=\"aryan\" priority=\"high\">\n          <title>Record the 2-minute demo video</title>\n          <description>Screen-record the internal agent/MCP workflow following the storyboard; redact data; captions; under 2:10; no URLs on screen.</description>\n          <prerequisites>P2-T01</prerequisites>\n          <tool>Screen recorder</tool>\n          <reference doc=\"03_PROFILE_AND_STOREFRONT.md\" section=\"8\"/>\n          <acceptance_criteria>File under 2:10, redacted, captioned.</acceptance_criteria>\n          <verify_live required=\"false\"/>\n          <rollback>None.</rollback>\n          <estimated_hours>3</estimated_hours>\n        </task>\n        <task id=\"P2-T03\" status=\"todo\" day=\"6\" owner=\"both\" priority=\"high\">\n          <title>Write case study 2 (internal agent/MCP system, honestly labelled)</title>\n          <description>Use the case-study template; label as a technical sample built for Aryan's own company; architecture diagram; no invented client result.</description>\n          <prerequisites>P2-T01</prerequisites>\n          <tool>Upwork UI: Portfolio (draft offline first)</tool>\n          <reference doc=\"03_PROFILE_AND_STOREFRONT.md\" section=\"7\"/>\n          <acceptance_criteria>Draft text complete; diagram made.</acceptance_criteria>\n          <verify_live required=\"false\"/>\n          <rollback>None.</rollback>\n          <estimated_hours>2</estimated_hours>\n        </task>\n        <task id=\"P2-T04\" status=\"todo status=\"todo\" related_tasks=\"P5-T10\">\n      <question>3 more completed, 1 Care Plan active, 3 case studies, demo video live?</question>\n      <metrics>work history; active retainers; portfolio.</metrics>\n      <if_passed>Rate $95; consultation $125.</if_passed>\n      <if_failed>Hold.</if_failed>\n    </gate>\n    <gate id=\"G5\" when=\"Day 90\" status=\"todo\" related_tasks=\"P5-T12\">\n      <question>On trajectory to $15K+ in 12 months? Progress on P6 criteria?</question>\n      <metrics>12-month earnings run-rate; funnel totals; effective hourly.</metrics>\n      <if_passed>P5 plan (hold / grow Connects to 400 / trim campaigns).</if_passed>\n      <if_failed>Restructure campaigns and offers; consider pausing the engine to focus on delivery.</if_failed>\n    </gate>\n    <gate id=\"G6\" when=\"Day 120 or later\" status=\"todo\" related_tasks=\"P6-T02 P6-T03\">\n      <question>All eight premium-ascent criteria met?</question>\n      <metrics>See 10_PREMIUM_ASCENT.md section 1.</metrics>\n      <if_passed>Premium storefront; $120\u2013150/hr.</if_passed>\n      <if_failed>$95 and Alt B title; wait.</if_failed>\n    </gate>\n  </decision_gates>\n\n  <offer_ladder>\n    <rung id=\"L1\" name=\"Paid consultation\" price=\"$75 / 30 min (\u2192 $100 \u2192 $125 \u2192 $150 with rate ladder)\" duration=\"30 min\" scope=\"Live call plus 1-page written note within 24 h: understanding, approach, cost range, first milestone.\" upsell=\"Fee credited against Sprint/Audit booked within 14 days.\"/>\n    <rung id=\"L2\" name=\"Claude / AI Workflow Setup Sprint\" price=\"$299 Starter / $599 Standard / $1,200 Team\" duration=\"2\u20135 days\" scope=\"Claude connected to tools, 1\u20135 Skills, permissions guide, recorded training, written handover, 7\u201314 days support.\" upsell=\"Handover doc ends with 'What I'd do next' (2\u20133 items) \u2192 Audit or Implementation.\"/>\n    <rung id=\"L3\" name=\"AI Operations &amp; Automation Audit\" price=\"$750 Focused / $1,500 Full\" duration=\"3\u20135 days\" scope=\"Written report: findings, scored issues, quick wins, roadmap with cost/time; readout call.\" upsell=\"100% credited against L4 signed within 30 days; roadmap table is the L4 quote.\"/>\n    <rung id=\"L4\" name=\"Done-For-You Implementation\" price=\"$3,000\u2013$4,000 Core / $4,500\u2013$6,000 Standard / $6,500\u2013$7,500+ Extended\" duration=\"2\u20134 weeks\" scope=\"3 milestones: 30% architecture and acceptance criteria / 50% build and test / 20% rollout, training, docs; hypercare as 4th in Extended.\" upsell=\"Care Plan offered in the Milestone 3 rollout meeting.\"/>\n    <rung id=\"L5\" name=\"AI Operations Care Plan\" price=\"$1,000 Keep-alive / $1,500 Improve / $2,500 Partner per month\" duration=\"monthly, 3-month minimum\" scope=\"Monitoring and fixes, health report, 2\u201310 h of changes, roadmap calls, new workflow per quarter at Partner tier.\" upsell=\"Referral ask at review time; Revedor case-study candidate.\"/>\n    <hourly sticker=\"$65\" steps=\"$80 (G3), $95 (G4), $120+ (G6)\" rule=\"Hourly only for hourly-only posts, retainers and advisory; always offer a fixed alternative on posts up to 10 h/week.\"/>\n  </offer_ladder>\n\n  <campaigns config=\"templates/campaigns.example.json\" version=\"1.0.0\" global_max_submits_per_day=\"5\" target_submits_per_day=\"3\" connects_budget_month=\"250\" searches_per_pass=\"20\" detail_fetches_per_pass=\"25\">\n    <campaign id=\"claude-implementation\" active=\"true\" priority=\"1\" fixed_floor=\"250\" hourly_floor=\"30\" max_drafts_per_day=\"3\" connects_cap_per_day=\"40\" score_threshold=\"70\" rung_default=\"sprint\">\n      <queries>Claude; Claude Code; Anthropic Claude setup; Claude for business team; Claude Cowork; Claude Skills</queries>\n      <title_filters>Claude</title_filters>\n      <subcategories>AI Apps &amp; Integration</subcategories>\n    </campaign>\n    <campaign id=\"mcp-integrations\" active=\"true\" priority=\"2\" fixed_floor=\"500\" hourly_floor=\"40\" max_drafts_per_day=\"1\" connects_cap_per_day=\"15\" score_threshold=\"70\" rung_default=\"implementation\">\n      <queries>MCP server; Model Context Protocol; Claude connector; custom MCP tool</queries>\n      <title_filters>MCP</title_filters>\n      <subcategories>AI Apps &amp; Integration</subcategories>\n    </campaign>\n    <campaign id=\"rag-knowledge\" active=\"true\" priority=\"3\" fixed_floor=\"750\" hourly_floor=\"40\" max_drafts_per_day=\"1\" connects_cap_per_day=\"20\" score_threshold=\"72\" rung_default=\"audit\">\n      <queries>RAG; knowledge base assistant documents; internal AI assistant SharePoint Notion; document Q&amp;A LLM</queries>\n      <title_filters>RAG</title_filters>\n      <subcategories>AI Apps &amp; Integration</subcategories>\n    </campaign>\n    <campaign id=\"ai-agents\" active=\"true\" priority=\"4\" fixed_floor=\"500\" hourly_floor=\"35\" max_drafts_per_day=\"2\" connects_cap_per_day=\"30\" score_threshold=\"72\" rung_default=\"implementation\">\n      <queries>AI agent build; autonomous agent workflow; LLM agent business process; agentic workflow approval</queries>\n      <title_filters>AI agent</title_filters>\n      <subcategories>AI Apps &amp; Integration</subcategories>\n    </campaign>\n    <campaign id=\"n8n-automation\" active=\"true\" priority=\"5\" fixed_floor=\"300\" hourly_floor=\"30\" max_drafts_per_day=\"2\" connects_cap_per_day=\"25\" score_threshold=\"70\" rung_default=\"sprint\">\n      <queries>n8n; n8n AI workflow; Make.com AI automation; Zapier to n8n migration</queries>\n      <title_filters>n8n</title_filters>\n      <subcategories>Scripting &amp; Automation; AI Apps &amp; Integration</subcategories>\n    </campaign>\n    <campaign id=\"integrations-repair\" active=\"true\" priority=\"6\" fixed_floor=\"250\" hourly_floor=\"35\" max_drafts_per_day=\"1\" connects_cap_per_day=\"15\" score_threshold=\"70\" rung_default=\"audit\">\n      <queries>fix automation; Zapier Make broken; OpenAI integration failing; API integration automation</queries>\n      <title_filters/>\n      <subcategories>Scripting &amp; Automation</subcategories>\n    </campaign>\n    <campaign id=\"ai-training-coaching\" active=\"true\" priority=\"7\" fixed_floor=\"300\" hourly_floor=\"40\" max_drafts_per_day=\"1\" connects_cap_per_day=\"10\" score_threshold=\"70\" rung_default=\"sprint\">\n      <queries>Claude training team; AI workshop small business; ChatGPT Claude coaching</queries>\n      <title_filters/>\n      <subcategories/>\n      <note>Secondary; cut at G2 if 0 qualified in 5 days.</note>\n    </campaign>\n    <exclude_terms>cold email; deliverability; gohighlevel; clay; apollo; smartlead; instantly; linkedin outreach; ios; android; unity; solidity; video editing; data entry; voice over</exclude_terms>\n  </campaigns>\n\n  <scoring_model doc=\"06_LEAD_SCORING_RUBRIC.md\" config=\"templates/scoring.example.json\" version=\"1.0\" max_score=\"100\">\n    <hard_disqualifiers>\n      <d id=\"D1\">Already applied / invitation exists / cannot apply (applied, can_apply, VJ-JA-10)</d>\n      <d id=\"D2\">Location required and India not eligible</d>\n      <d id=\"D3\">Capability gate (native mobile, Unity, Apex, blockchain, video, pure design/copy, data entry)</d>\n      <d id=\"D4\">Off-platform or policy violations</d>\n      <d id=\"D5\">Staffing/agency pool or commission/equity-only</d>\n      <d id=\"D6\">Payment unverified AND $0 spend AND 0 hires</d>\n      <d id=\"D7\">Fixed under $100 or hourly ceiling under $25</d>\n      <d id=\"D8\">Older than 72 h AND 50+ proposals AND 0 interviewing</d>\n      <d id=\"D9\">Free test task over 1 hour</d>\n      <d id=\"D10\">Conflict: open proposal/contract with same client</d>\n    </hard_disqualifiers>\n    <categories>\n      <category id=\"A\" name=\"Fit to positioning\" weight=\"35\">A1 title match 15; A2 workflow clarity 8; A3 rung match 7; A4 proof match 5</category>\n      <category id=\"B\" name=\"Client quality\" weight=\"25\">B1 total spent 8 (unknown = 0.4, not zero); B2 hire rate 5; B3 rating 4; B4 avg hourly paid 5; B5 payment verified 3</category>\n      <category id=\"C\" name=\"Money\" weight=\"15\">C1 fixed budget or hourly ceiling 10; C2 duration 5</category>\n      <category id=\"D\" name=\"Competition and timing\" weight=\"15\">D1 proposals 7; D2 freshness 4; D3 client engagement 4</category>\n      <category id=\"E\" name=\"Risk and friction\" weight=\"10\">E1 screening questions 3; E2 red-flag language 3; E3 scope clarity 2; E4 Connects cost 2</category>\n    </categories>\n    <modifiers>+5 open related jobs/active contracts; +5 Claude/Anthropic named; +3 IST-friendly time zone; \u221210 pile-on and bidding above avg paid; \u22125 preferred-location soft mismatch</modifiers>\n    <thresholds apply=\"70\" review=\"55\" skip=\"below 55\"/>\n    <caps max_drafts_per_day=\"5\" target=\"3\" connects_gate=\"balance must exceed 2 \u00d7 (connects_cost + boost)\" boost_max=\"10\" boost_min_score=\"80\"/>\n    <calibration>Log score and outcome per proposal; after 20\u201330 qualified proposals compute reply rate by band; move threshold \u00b15; re-weight one block per month; record scoring_version.</calibration>\n  </scoring_model>\n\n  <skills>\n    <skill dir=\"skills/upwork-hunt\" trigger=\"Start of every combined pass; 'hunt', 'find jobs', 'refresh the queue'\" inputs=\"campaigns.json, state.json (last_run_at, kill_switch), MCP find_jobs\" outputs=\"New/refreshed job records (status discovered), counts, mismatches\" writes=\"jobs.json, runs.jsonl\"/>\n    <skill dir=\"skills/upwork-vet\" trigger=\"After hunt; 'vet', 'score', 'qualify'\" inputs=\"Job detail payloads, scoring.json, open proposals/contracts cache\" outputs=\"score, breakdown, decision, reasons, rung, pricing hint\" writes=\"jobs.json (status scored)\"/>\n    <skill dir=\"skills/upwork-proposal-draft\" trigger=\"APPLY jobs (or REVIEW with free slot)\" inputs=\"Job record, aryan-profile-facts, pricing rules\" outputs=\"cover_letter, answers, terms, proof_used, risk_stated, self_check\" writes=\"jobs.json (status drafted)\"/>\n    <skill dir=\"skills/upwork-human-review-submit\" trigger=\"Drafts waiting; Aryan says submit/skip/hold/confirm\" inputs=\"Drafted jobs, checklist\" outputs=\"Review decisions; proposal_id after two confirmations\" writes=\"jobs.json, state.applies_today; MCP manage_proposals, confirm_preview (only skill allowed)\"/>\n    <skill dir=\"skills/upwork-rebake-analytics\" trigger=\"22:30 IST daily; 'rebake', 'funnel report', 'reconcile'\" inputs=\"list_freelancer_proposals, get_room/get_messages, dashboard, connects_balance, contracts\" outputs=\"Outcome updates, ledger check, funnel metrics, suggestions, digest, Sunday weekly review\" writes=\"jobs.json outcome fields, state.telemetry, incidents, kill_switch\"/>\n    <skill dir=\"skills/upwork-campaign-editor\" trigger=\"Add/pause campaign, change queries/caps/thresholds/weights\" inputs=\"campaigns.json, scoring.json, schemas, last 7 days of jobs\" outputs=\"Validated diff, dry-run effect, versioned save with changelog\" writes=\"campaigns.json, scoring.json, backups\"/>\n    <skill dir=\"skills/upwork-state-and-debugging\" trigger=\"Run failure, wrong numbers, ledger drift, reconnect/migration\" inputs=\"runs.jsonl, state.json, jobs.json, MCP list_accounts/tools\" outputs=\"Diagnosis, minimal repairs with backup, kill switch toggles\" writes=\"state files after backup\"/>\n    <skill dir=\"skills/aryan-profile-facts\" trigger=\"Loaded first by every drafting skill\" inputs=\"Aryan-maintained facts\" outputs=\"Allowed claims, proof inventory with permissions, tools allowlist, prices, voice, never-claim list\" writes=\"none\"/>\n    <skill dir=\"skills/past-client-reactivation\" trigger=\"Week 1\u20132; reactivation prep and tracking\" inputs=\"list_contracts, templates, 05 playbook\" outputs=\"Segmented list, personalised messages for Aryan, tracker updates, offer recommendations\" writes=\"reactivation tracker (outside repo)\"/>\n  </skills>\n\n  <runbooks>\n    <runbook path=\"agent_instructions/combined_pass.md\" schedule=\"08:30, 12:30, 18:30 (optional 21:30) IST working days\" steps=\"Preflight (identity, kill switch, Connects) \u2192 Hunt \u2192 Vet \u2192 Draft \u2192 Review queue \u2192 Close\" never=\"Submits\"/>\n    <runbook path=\"agent_instructions/evening_rebake.md\" schedule=\"22:30 IST daily; Sunday adds weekly review\" steps=\"Preflight \u2192 Outcomes \u2192 Messages (drafts only) \u2192 Invitations \u2192 Telemetry \u2192 Ledger \u2192 Contracts \u2192 Funnel \u2192 Calibration suggestions \u2192 Incidents/kill switch \u2192 Housekeeping \u2192 Digest\" never=\"Sends messages, submits, buys\"/>\n    <runbook path=\"agent_instructions/human_in_the_loop.md\" schedule=\"always\" steps=\"Permission matrix: agent alone / agent after Aryan says so / Aryan only; trigger words\" never=\"Ambiguity treated as no\"/>\n  </runbooks>\n\n  <verify_live_registry>\n    <item id=\"VL-01\" status=\"unverified\" verified=\"false\" used_in=\"03 \u00a71; P1-T04; P6-T03\">Title character limit (believed ~70) in the profile edit box.</item>\n    <item id=\"VL-02\" status=\"unverified\" verified=\"false\" used_in=\"03 \u00a73; P1-T04\">Overview character limit (believed 5,000).</item>\n    <item id=\"VL-03\" status=\"unverified\" verified=\"false\" used_in=\"03 \u00a74; P1-T04\">Skills slot count (15) and exact taxonomy labels for Claude / MCP.</item>\n    <item id=\"VL-04\" status=\"unverified\" verified=\"false\" used_in=\"03 \u00a75; 09 E1; P1-T05\">Availability badge weekly Connects cost.</item>\n    <item id=\"VL-05\" status=\"unverified\" verified=\"false\" used_in=\"02 \u00a70.6; P1-T02\">Freelancer Plus price and Connects allowance.</item>\n    <item id=\"VL-06\" status=\"unverified\" verified=\"false\" used_in=\"03 \u00a75; 04 L1; P1-T05\">Consultation allowed durations, prices and fee.</item>\n    <item id=\"VL-07\" status=\"unverified\" verified=\"false\" used_in=\"03 rified=\"true\" used_in=\"facts \u00a71; P1-T03; P5-T07\">Exact live numbers: JSS (100%), earnings ($20K+), 38 jobs (23 fixed, 15 hourly; 21 reviews), 395 hours, Connects (110).</item>\n    <item id=\"VL-21\" status=\"verified\" verified=\"true\" used_in=\"facts \u00a71\">Displayed name on profile: Aryan P. (Aryan Pegwar).</item>\n    <item id=\"VL-22\" status=\"verified\" verified=\"true\" used_in=\"facts \u00a71\">Education: RNSIT (BEng 2017-2021), Udacity (Intel Edge AI 2020); Employment: TillyBilly, Deloitte.</item>\n    <item id=\"VL-23\" status=\"unverified\" verified=\"false\" used_in=\"03 \u00a77; facts \u00a72; P2-T04\">Repeat enterprise client contract count and permission to describe it.</item>\n    <item id=\"VL-24\" status=\"verified\" verified=\"true\" used_in=\"05 S5; P3-T01\">2026-08-31 invitation: Closed/declined on 2026-09-03.</item>\n    <item id=\"VL-25\" status=\"verified\" verified=\"true\" used_in=\"05 \u00a71; P3-T02\">Fields returned by list_contracts (data.vendorContracts.contracts[] with id, offerId, title, status, clientOrganization).</item>\n    <item id=\"VL-26\" status=\"unverified\" verified=\"false\" used_in=\"05 \u00a71\">Client counts per reactivation segment (16 clients in 24 months).</item>\n    <item id=\"VL-27\" status=\"unverified\" verified=\"false\" used_in=\"05 \u00a74; P3-T08\">JSS treatment of milestones on existing contracts vs new contracts.</item>\n    <item id=\"VL-28\" status=\"verified\" verified=\"true\" used_in=\"08 NN4; P4-T01\">MCP connector identity confirmed as Aryan.</item>\n    <item id=\"VL-29\" status=\"verified\" verified=\"true\" used_in=\"08 \u00a71 step 0; P4-T02\">MCP tool count: exactly 51 tools observed on Upwork MCP server.</item>\n    <item id=\"VL-30\" status=\"unverified\" verified=\"false\" used_in=\"08 \u00a71 step 1a; hunt skill\">verified_payment_only accepted on smart_search or only on search.</item>\n    <item id=\"VL-31\" status=\"unverified\" verified=\"false\" used_in=\"06 D2; jobs schema\">preferred_locations field names.</item>\n    <item id=\"VL-32\" status=\"unverified\" verified=\"false\" used_in=\"08 \u00a75; vet skill\">Stable client id in payload for conflict checks.</item>\n    <item id=\"VL-33\" status=\"unverified\" verified=\"false\" used_in=\"08 \u00a71 step 9; submit skill\">acknowledge_policy requirement before create on some jobs.</item>\n    <item id=\"VL-34\" status=\"unverified\" verified=\"false\" used_in=\"09 \u00a71; rebake skill; P4-T09\">Exact proposal status strings exposed by list_freelancer_proposals (viewed may not exist).</item>\n    <item id=\"VL-35\" status=\"unverified\" verified=\"false\" used_in=\"05 \u00a70\">get_messages exposes existing contract rooms for reactivation.</item>\n  </verify_live_registry>\n\n  <placeholders_registry>\n    <placeholder id=\"PH-01\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"1\" name=\"{{FIRST_NAME LAST_NAME}}\" status=\"done\">Displayed profile name: Aryan P. (Aryan Pegwar).</placeholder>\n    <placeholder id=\"PH-02\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"1\" name=\"{{YYYY-MM-DD}}\" status=\"done\">Last verified date: 2026-10-05.</placeholder>\n    <placeholder id=\"PH-03\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"1\" name=\"{{Degree, institution}} / {{role, company}} / {{Languages}} / {{Certifications}}\" status=\"done\">Education, employment, languages, certifications filled from live Upwork profile.</placeholder>\n    <placeholder id=\"PH-04\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"2\" name=\"C1\u2013C10 {{title}} {{rating}} {{permission}} {{description}}\" status=\"todo\">Past contracts usable as proof with permission levels.</placeholder>\n    <placeholder id=\"PH-05\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"3\" name=\"P1\u2013P9 {{one_line}} {{permission}} {{asset}} {{portfolio_project_id}}\" status=\"todo\">Proof inventory.</placeholder>\n    <placeholder id=\"PH-06\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"3\" name=\"{{client quotes}}\" status=\"todo\">Up to three verbatim review quotes.</placeholder>\n    <placeholder id=\"PH-07\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"4\" name=\"{{confirm}} tool entries\" status=\"todo\">Tools allowlist confirmations (n8n, Make, Zapier, LangChain, vector store, HubSpot, Airtable, Playwright/Scrapy, Docker, cloud).</placeholder>\n    <placeholder id=\"PH-08\" file=\"skills/aryan-profile-facts/SKILL.md\" section=\"8\" name=\"{{working hours}}\" status=\"todo\">Call availability window.</placeholder>\n    <placeholder id=\"PH-09\" file=\"03_PROFILE_AND_STOREFRONT.md\" section=\"3\" name=\"{{PROOF_1}} {{PROOF_2}} {{PROOF_3}} {{CLIENT_QUOTE}} {{CLIENT_FIRST_NAME_OR_ROLE}}\" status=\"todo\">Overview proof bullets and quote.</placeholder>\n    <placeholder id=\"PH-10\" file=\"03_PROFILE_AND_STOREFRONT.md\" section=\"7\" name=\"{{CASE_1}} {{CASE_3}} and template fields\" status=\"todo\">Case studies 1 and 3 content.</placeholder>\n    <placeholder id=\"PH-11\" file=\"03_PROFILE_AND_STOREFRONT.md\" section=\"8\" name=\"{{WORKFLOW_NAME}} {{my own company / a client}} {{the trigger}} {{tool}} {{output}} {{destination}}\" status=\"todo\">Demo video script fields.</placeholder>\n    <placeholder id=\"PH-12\" file=\"07_PROPOSAL_SYSTEM.md\" section=\"9.1\u20139.5\" name=\"{{PROOF_CLAUDE_OR_CHATBOT}} {{PROOF_N8N_OR_INTEGRATION}} {{PROOF_AGENT_OR_SCRAPING}} {{PROOF_RAG_OR_CHATBOT}} {{PROOF_REPAIR_OR_INTEGRATION}}\" status=\"todo\">Proof bullets in the five example letters (resolved from the inventory at draft time).</placeholder>\n    <placeholder id=\"PH-13\" file=\"05_PAST_CLIENT_REACTIVATION.md\" section=\"3\" name=\"{{FIRST_NAME}} {{SYSTEM_BUILT}} {{CONTRACT_TITLE}} {{MONTH YEAR}} {{COMPANY_OR_CONTEXT}} {{ONE_SPECIFIC_IDEA}} {{ONE_NEW_VALUE}} {{RATE}}\" status=\"todo\">Per-message fields filled at send time.</placeholder>\n    <placeholder id=\"PH-14\" file=\"templates/reactivation_tracker.csv\" section=\"rows\" name=\"{{FIRST_NAME}} ratings and room links\" status=\"todo\">Tracker seed rows.</placeholder>\n    <placeholder id=\"PH-15\" file=\"templates/proposal_review_checklist.md\" section=\"header\" name=\"{{title}} {{url}} \u2026 {{answers}}\" status=\"n/a\">Runtime fields filled by the agent per draft.</placeholder>\n    <placeholder id=\"PH-16\" file=\"templates/weekly_funnel_review.md\" section=\"all\" name=\"{{YYYY-WW}} and metric cells\" status=\"n/a\">Runtime fields filled weekly.</placeholder>\n  </placeholders_registry>\n\n  <metrics doc=\"09_FUNNEL_METRICS_AND_EXPERIMENTS.md\">\n    <kpi id=\"qualified_rate\" formula=\"qualified / discovered\" target=\"5\u201310%\" alarm=\"under 2% or over 20%\"/>\n    <kpi id=\"draft_approval_rate\" formula=\"approved / drafted\" target=\"70%+\" alarm=\"under 50%\"/>\n    <kpi id=\"proposals_per_day\" formula=\"submitted / working day\" target=\"3 (max 5)\" alarm=\"under 2 for 3 days\"/>\n    <kpi id=\"view_rate\" formula=\"viewed / submitted\" target=\"50%+\" alarm=\"under 30%\"/>\n    <kpi id=\"reply_rate\" formula=\"replied / submitted\" target=\"15%+\" alarm=\"under 8% after 20 proposals\"/>\n    <kpi id=\"interview_rate\" formula=\"interview / submitted\" target=\"8%+\" alarm=\"\"/>\n    <kpi id=\"hire_rate\" formula=\"hired / submitted\" target=\"4%+ (about 1 in 25)\" alarm=\"under 2% after 50\"/>\n    <kpi id=\"cost_per_reply\" formula=\"Connects \u00d7 $0.15 / replies\" target=\"$25 or less\" alarm=\"\"/>\n    <kpi id=\"cost_per_hire\" formula=\"Connects \u00d7 $0.15 / hires\" target=\"$150 or less\" alarm=\"\"/>\n    <kpi id=\"avg_contract_value\" formula=\"sum / hires\" target=\"$600 P2; $2,000 P3\" alarm=\"\"/>\n    <kpi id=\"effective_hourly\" formula=\"earned / hours incl. proposal time\" target=\"$50 P2; $80 P3\" alarm=\"\"/>\n    <kpi id=\"profile_views_week\" formula=\"dashboard\" target=\"3\u00d7 baseline within 30 days\" alarm=\"\"/>\n    <kpi id=\"invites_week\" formula=\"dashboard\" target=\"1+ by Day 30\" alarm=\"\"/>\n    <kpi id=\"jss\" formula=\"insights page\" target=\"100%\" alarm=\"any drop\"/>\n    <kpi id=\"response_time\" formula=\"Upwork metric\" target=\"under 24 h\" alarm=\"\"/>\n    <reassessment after_qualified_proposals=\"20\u201330\" day=\"about 25\u201335\" actions=\"Keep two best campaigns; halve Connects of 0-reply campaigns with 8+ proposals; threshold \u00b15; fixed vs hourly default; 48 h pause if reply under 8%\"/>\n    <experiments>\n      <experiment id=\"E1\" name=\"Availability badge on vs prior 4 weeks\" metric=\"profile views, invites\"/>\n      <experiment id=\"E2\" name=\"Title primary vs Alt A\" metric=\"views, invites\"/>\n      <experiment id=\"E3\" name=\"Opener mirror vs explicit-ask\" metric=\"view\u2192reply\"/>\n      <experiment id=\"E4\" name=\"Fixed Sprint vs hourly bid on hourly posts up to 10 h/week\" metric=\"reply, hire\"/>\n      <experiment id=\"E5\" name=\"Boost up to 10 on 85+ band vs none\" metric=\"view rate, cost per reply\"/>\n      <experiment id=\"E6\" name=\"Consultation $75 vs $100\" metric=\"bookings/month\"/>\n      <experiment id=\"E7\" name=\"Letter length 120\u2013160 vs 180\u2013220 words\" metric=\"reply rate\"/>\n      <experiment id=\"E8\" name=\"Specialized profile AI Training live vs not\" metric=\"invites from training posts\"/>\n    </experiments>\n  </metrics>\n\n</implementation_plan>\n"}, {"name": "UPWORK_MCP_DOCUMENTATION.xml", "relpath": "UPWORK_MCP_DOCUMENTATION.xml", "category": "MCP Protocols & Schemas", "size_bytes": 24996, "content": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<upwork_mcp_specification version=\"1.0\" generated_at=\"2026-10-04T14:32:00+05:30\">\n  <metadata>\n    <title>Upwork Model Context Protocol (MCP) Server Specification &amp; Automation Manual</title>\n    <official_docs_url>https://www.upwork.com/ai/mcp#see-what-you-can-do</official_docs_url>\n    <protocol_standard>Model Context Protocol (MCP) JSON-RPC 2.0</protocol_standard>\n    <tool_count total=\"51\" />\n    <target_use_case>Autonomous Job Discovery, Client Intelligence &amp; Automated Proposal Drafting</target_use_case>\n  </metadata>\n\n  <architecture>\n    <description>\n      The Upwork MCP Server serves as a direct bridge between autonomous AI agents and the Upwork freelance marketplace.\n      It enforces a two-phase \"Draft-and-Confirm\" pattern to safeguard freelancer Connects balances, prevent platform spam,\n      and ensure full compliance with Upwork Terms of Service.\n    </description>\n    <auth_model>\n      <type>OAuth 2.1</type>\n      <context_resolution>\n        <step number=\"1\" tool=\"upwork__list_accounts\">\n          Enumerate available accounts across Freelancer, Client, and Agency personas.\n        </step>\n        <step number=\"2\" parameter=\"org_uid\">\n          Obtain the specific organization identifier (org_uid). Every subsequent tool invocation requires this org_uid.\n        </step>\n      </context_resolution>\n    </auth_model>\n    <safety_governance>\n      <principle name=\"draft_and_confirm\">\n        All state-modifying actions (proposals, postings, milestone submissions, profile edits) generate an ephemeral server-side preview with a unique preview_id.\n        No change is made live until upwork__confirm_preview is called with that preview_id.\n      </principle>\n      <principle name=\"human_confirmation_gate\">\n        AI agents are strictly prohibited from confirming proposals without presenting Connects costs, bid amounts, and full draft copy to the human operator.\n      </principle>\n      <principle name=\"legal_commitment_boundary\">\n        Accepting contract offers (respond_to_offer action=accept) cannot be finalized via MCP. It returns a finalize_url requiring human cryptographic signature on upwork.com.\n      </principle>\n      <principle name=\"anti_disintermediation\">\n        The tool requires explicit policy acknowledgment before facilitating direct client negotiations.\n      </principle>\n    </safety_governance>\n  </architecture>\n\n  <job_proposal_automation_engine>\n    <overview>\n      Designed specifically for freelancers seeking to automate the discovery of newly posted, high-converting marketplace jobs and prepare ready-to-confirm proposals.\n    </overview>\n\n    <workflow_stages>\n      <stage id=\"1\" name=\"fresh_job_discovery\">\n        <recommended_tool>upwork__find_jobs</recommended_tool>\n        <action>smart_search</action>\n        <configuration>\n          <param name=\"mode\" value=\"most_recent\">\n            Accesses the personalized recommendation feed ranked in reverse chronological order.\n          </param>\n          <param name=\"days_posted\" value=\"1\">\n            Enforces a strict 24-hour publication window (\"posted today\"). Note: smart_search is the ONLY endpoint supporting real date filtering.\n          </param>\n          <param name=\"verified_payment_only\" value=\"true\">\n            Eliminates unverified spam accounts and payment fraud risks.\n          </param>\n          <param name=\"limit\" value=\"10\">\n            Standard pagination size. Subsequent pages retrieved using the next_cursor token.\n          </param>\n        </configuration>\n        <alternative_search_tool action=\"search\">\n          <description>Use for exact keyword or role targeting across the entire marketplace.</description>\n          <best_practice>\n            Prefer title parameter over query (e.g., title=\"Fullstack Python\") to avoid semantic expansion noise. Title words are strictly ANDed and stemmed.\n          </best_practice>\n          <proposals_filter min=\"0\" max=\"10\">\n            Target jobs with fewer than 10 submissions before competition intensifies.\n          </proposals_filter>\n          <rate_overlap_logic>\n            <rate_min>Matches jobs where posted budget maximum is greater than or equal to rate_min.</rate_min>\n            <rate_max>Matches jobs where posted budget minimum is less than or equal to rate_max.</rate_max>\n          </rate_overlap_logic>\n        </alternative_search_tool>\n      </stage>\n\n      <stage id=\"2\" name=\"deep_telemetry_vetting\">\n        <recommended_tool>upwork__find_jobs</recommended_tool>\n        <action>get</action>\n        <payload_analysis>\n          <field name=\"client_record\">\n            <attribute name=\"total_spent\">Lifetime platform spend. Benchmark: prefer &gt; $1,000 USD.</attribute>\n            <attribute name=\"hire_rate_percent\">Hiring velocity. Benchmark: prefer &gt; 50% hire rate.</attribute>\n            <attribute name=\"rating\">Freelancers' aggregate review score of the client (1.0 to 5.0). Flag ratings below 4.6.</attribute>\n            <attribute name=\"active_contracts\">Concurrent active engagements.</attribute>\n          </field>\n          <field name=\"activityStat.jobActivity\">\n            <attribute name=\"totalHired\">If &gt; 0 for a single-seat job, the role is filled. Discard immediately.</attribute>\n            <attribute name=\"totalOffered\">Pending offers. High values indicate advanced client decision stages.</attribute>\n            <attribute name=\"totalInvitedToInterview\">Current interviewing candidates.</attribute>\n          </field>\n          <field name=\"client_feedback\">\n            <description>\n              Up to 5 recent reviews left by other freelancers. Automation engines should extract named contacts (e.g. 'Sarah was amazing')\n              to personalize cover letters directly without guesswork.\n            </description>\n          </field>\n          <field name=\"preferred_qualifications\">\n            <description>Inspect English proficiency, Job Success Score (JSS), location bounds, and talent badges.</description>\n          </field>\n          <field name=\"connects_cost\">Exact number of Connects debited upon submission.</field>\n          <field name=\"applied\">Boolean check. If true, agent must abort proposal flow.</field>\n        </payload_analysis>\n      </stage>\n\n      <stage id=\"3\" name=\"pre_submission_conflict_check\">\n        <critical_rule error_code=\"VJ-JA-10\">\n          Invoking manage_proposals action=create when an invitation or previous proposal already exists triggers error VJ-JA-10.\n          The agent MUST perform the following validations before drafting:\n        </critical_rule>\n        <validation_call step=\"A\" tool=\"upwork__list_freelancer_proposals\" action=\"invitations\">\n          <condition>If invitation exists for target jobPosting.id, ABORT action=create and route to action=accept_invitation.</condition>\n        </validation_call>\n        <validation_call step=\"B\" tool=\"upwork__list_freelancer_proposals\" action=\"list\">\n          <condition>If proposal already exists with status Pending/Accepted, ABORT.</condition>\n        </validation_call>\n      </stage>\n\n      <stage id=\"4\" name=\"proposal_generation_and_drafting\">\n        <recommended_tool>upwork__manage_proposals</recommended_tool>\n        <action>create</action>\n        <input_schema_mapping>\n          <param name=\"job_reference\" type=\"string\" required=\"true\">\n            Numeric job ID from search results (NOT the ~02... ciphertext).\n          </param>\n          <param name=\"charged_amount\" type=\"number\" required=\"true\">\n            Proposed hourly rate or fixed price project fee.\n          </param>\n          <param name=\"cover_letter\" type=\"string\" required=\"true\" max_chars=\"5000\">\n            Tailored, authentic cover letter referencing specific client requirements, named contacts from feedback, and relevant past project deliveries.\n          </param>\n          <param name=\"answers\" type=\"array\" required=\"conditional\">\n            Required when job carries screening_questions. Array of { question, answer } objects.\n          </param>\n          <param name=\"portfolio_project_ids\" type=\"array\" required=\"false\">\n            Project IDs fetched via upwork__get_profile action=list_highlights.\n          </param>\n          <param name=\"certificate_ids\" type=\"array\" required=\"false\">\n            Certificate IDs fetched via upwork__get_profile action=list_highlights.\n          </param>\n          <param name=\"boost_connects\" type=\"integer\" required=\"false\">\n            Connects bid for paid ranking slot. Must adhere to boost auction dynamics.\n          </param>\n        </input_schema_mapping>\n        <boost_auction_rules>\n          <rule name=\"minimum_bid\">Must be greater than or equal to preview.boost.recommended_connects.</rule>\n          <rule name=\"balance_ceiling\">Cannot exceed preview.boost.max_boost_connects (connects_balance minus proposal connects_cost).</rule>\n          <rule name=\"skip_condition\">Do not boost if preview.boost.recommendation is 'skip' or boost.available is false.</rule>\n        </boost_auction_rules>\n      </stage>\n\n      <stage id=\"5\" name=\"human_confirmation_and_execution\">\n        <recommended_tool>upwork__confirm_preview</recommended_tool>\n        <action>confirm</action>\n        <execution_parameters>\n          <param name=\"type\" value=\"proposal\" />\n          <param name=\"preview_id\" value=\"[server-issued preview_id from create action]\" />\n        </execution_parameters>\n        <behavior>\n          The MCP server loads all previously staged parameters from internal server storage.\n          Upon successful execution, proposal status changes to 'Pending' / 'Accepted' (submitted and validated).\n        </behavior>\n      </stage>\n    </workflow_stages>\n  </job_proposal_automation_engine>\n\n  <tool_catalog>\n    <category name=\"Account &amp; Configuration\">\n      <tool name=\"upwork__list_accounts\" read_only=\"true\">\n        <description>Enumerate available Upwork accounts (Freelancer, Client, Agency). Essential entry point.</description>\n        <parameters />\n      </tool>\n      <tool name=\"upwork__get_account\" read_only=\"true\">\n        <description>Retrieve company, team, or profile metadata for the authenticated org_uid.</description>\n        <actions><action name=\"get\" /></actions>\n      </tool>\n      <tool name=\"upwork__update_account\" read_only=\"false\">\n        <description>Update account parameters, company details, team names, or member invites.</description>\n        <actions>\n          <action name=\"update_company\" />\n          <action name=\"update_location\" />\n          <action name=\"update_profile\" />\n          <action name=\"rename_team\" />\n          <action name=\"create_team\" />\n          <action name=\"invite_member\" />\n        </actions>\n      </tool>\n      <tool name=\"upwork__set_tool_mode\" read_only=\"false\">\n        <description>Configure MCP presentation mode: full_list vs search_execute.</description>\n        <actions><action name=\"get\" /><action name=\"set\" /></actions>\n      </tool>\n      <tool name=\"upwork__set_tool_permission\" read_only=\"false\">\n        <description>Configure write-tool confirmation thresholds: always_ask vs always_allow.</description>\n        <actions><action name=\"get\" /><action name=\"set\" /></actions>\n      </tool>\n      <tool name=\"upwork__get_tool_help\" read_only=\"true\">\n        <description>Introspect complete schema and documentation for any named Upwork MCP tool.</description>\n        <parameters><param name=\"tool_name\" type=\"string\" required=\"true\" /></parameters>\n      </tool>\n    </category>\n\n    <category name=\"Job Discovery &amp; Marketplace\">\n      <tool name=\"upwork__find_jobs\" read_only=\"true\">\n        <description>Comprehensive marketplace job search, detail retrieval, and personalized recommendation engine.</description>\n        <actions>\n          <action name=\"search\">\n            <params>\n              <param name=\"query\" type=\"string\" />\n              <param name=\"title\" type=\"string\" />\n              <param name=\"job_type\" type=\"string\" enum=\"fixed,hourly\" />\n              <param name=\"experience_level\" type=\"string\" enum=\"entry_level,intermediate,expert\" />\n              <param name=\"budget_min\" type=\"number\" />\n              <param name=\"budget_max\" type=\"number\" />\n              <param name=\"rate_min\" type=\"number\" />\n              <param name=\"rate_max\" type=\"number\" />\n              <param name=\"skills\" type=\"array\" max_items=\"5\" />\n              <param name=\"category\" type=\"string\" />\n              <param name=\"subcategory\" type=\"string\" />\n              <param name=\"workload\" type=\"string\" enum=\"full_time,part_time,as_needed\" />\n              <param name=\"duration\" type=\"string\" enum=\"less_than_1_month,1_to_3_months,3_to_6_months,more_than_6_months\" />\n              <param name=\"verified_payment_only\" type=\"boolean\" />\n              <param name=\"proposals_min\" type=\"integer\" />\n              <param name=\"proposals_max\" type=\"integer\" />\n              <param name=\"client_hires_min\" type=\"integer\" />\n              <param name=\"client_hires_max\" type=\"integer\" />\n              <param name=\"sort\" type=\"string\" enum=\"recency,relevance,client_total_charge,client_rating\" />\n              <param name=\"location\" type=\"string\" />\n              <param name=\"timezone\" type=\"string\" />\n              <param name=\"limit\" type=\"integer\" default=\"10\" />\n              <param name=\"cursor\" type=\"string\" />\n            </params>\n          </action>\n          <action name=\"get\">\n            <params>\n              <param name=\"id\" type=\"string\" required=\"true\" />\n            </params>\n          </action>\n          <action name=\"smart_search\">\n            <params>\n              <param name=\"mode\" type=\"string\" enum=\"best_match,most_recent\" required=\"true\" />\n              <param name=\"days_posted\" type=\"integer\" />\n              <param name=\"from_date\" type=\"string\" />\n              <param name=\"to_date\" type=\"string\" />\n              <param name=\"limit\" type=\"integer\" default=\"10\" />\n              <param name=\"cursor\" type=\"string\" />\n            </params>\n          </action>\n        </actions>\n      </tool>\n      <tool name=\"upwork__find_saved_jobs\" read_only=\"true\">\n        <description>Browse and count bookmarked favorite job postings.</description>\n        <actions><action name=\"list\" /><action name=\"count\" /></actions>\n      </tool>\n      <tool name=\"upwork__save_job\" read_only=\"false\">\n        <description>Save/bookmark a job, unsave, or hide a job from future search results with specific feedback.</description>\n        <actions>\n          <action name=\"save\" />\n          <action name=\"unsave\" />\n          <action name=\"hide\" />\n          <action name=\"unhide\" />\n          <action name=\"hide_status\" />\n        </actions>\n      </tool>\n      <tool name=\"upwork__get_rate_insights\" read_only=\"true\">\n        <description>Fetch market hourly rate range (rate_low / rate_high) for given occupation and experience level.</description>\n        <actions><action name=\"get\" /></actions>\n      </tool>\n      <tool name=\"upwork__get_job_posting\" read_only=\"true\">\n        <description>View organization-owned job postings (for client or agency accounts).</description>\n        <actions><action name=\"get\" /><action name=\"list\" /></actions>\n      </tool>\n    </category>\n\n    <category name=\"Freelancer Profile &amp; Intelligence\">\n      <tool name=\"upwork__get_profile\" read_only=\"true\">\n        <description>Retrieve freelancer profile aggregates, work history, portfolio highlights, and Connects ledger.</description>\n        <actions>\n          <action name=\"get\" />\n          <action name=\"list_highlights\" />\n          <action name=\"transactions\" />\n          <action name=\"connects_balance\" />\n        </actions>\n      </tool>\n      <tool name=\"upwork__get_freelancer_dashboard\" read_only=\"true\">\n        <description>Consolidated parallel check for invitations, offers, active messages, contract updates, and Connects.</description>\n        <actions><action name=\"check\" /></actions>\n      </tool>\n      <tool name=\"upwork__get_freelancer_financials\" read_only=\"true\">\n        <description>Retrieve freelancer balance, lifetime earnings, pending payments, and escrow releases.</description>\n      </tool>\n      <tool name=\"upwork__update_profile\" read_only=\"false\">\n        <description>Update profile overview, title, skills, employment, education, language, and availability.</description>\n      </tool>\n      <tool name=\"upwork__boost_profile\" read_only=\"false\">\n        <description>Manage profile boost bidding and toggle the availability badge.</description>\n      </tool>\n    </category>\n\n    <category name=\"Proposal Lifecycle &amp; Confirmations\">\n      <tool name=\"upwork__manage_proposals\" read_only=\"false\">\n        <description>Draft proposals, accept/decline client invites, withdraw proposals, edit terms, or propose contracts.</description>\n        <actions>\n          <action name=\"create\" />\n          <action name=\"accept_invitation\" />\n          <action name=\"decline_invitation\" />\n          <action name=\"withdraw\" />\n          <action name=\"edit_terms\" />\n          <action name=\"send_proposal\" />\n          <action name=\"acknowledge_policy\" />\n        </actions>\n      </tool>\n      <tool name=\"upwork__list_freelancer_proposals\" read_only=\"true\">\n        <description>Inspect submitted proposals, status codes, stored Connects bids, competitor insights, and invitations.</description>\n        <actions>\n          <action name=\"list\" />\n          <action name=\"invitations\" />\n          <action name=\"get\" />\n          <action name=\"get_room\" />\n        </actions>\n      </tool>\n      <tool name=\"upwork__confirm_preview\" read_only=\"false\">\n        <description>The primary execution gate. Confirms and executes any staged preview using preview_id.</description>\n        <actions><action name=\"confirm\" /></actions>\n      </tool>\n      <tool name=\"upwork__get_preview\" read_only=\"true\">\n        <description>Inspect details of a pending preview prior to execution.</description>\n        <actions><action name=\"get\" /></actions>\n      </tool>\n    </category>\n\n    <category name=\"Attachments &amp; Files\">\n      <tool name=\"upwork__start_attachment_upload\" read_only=\"false\">\n        <description>Initialize secure file upload session for proposals, messages, or milestones.</description>\n        <actions><action name=\"upload\" /></actions>\n      </tool>\n      <tool name=\"upwork__confirm_attachment_upload\" read_only=\"false\">\n        <description>Confirm completion of an attachment upload.</description>\n      </tool>\n      <tool name=\"upwork__get_upload_status\" read_only=\"true\">\n        <description>Check upload status of a file in transit.</description>\n      </tool>\n      <tool name=\"upwork__store_uploaded_files\" read_only=\"false\">\n        <description>Persist uploaded attachments into platform storage.</description>\n      </tool>\n    </category>\n\n    <category name=\"Messaging &amp; Rooms\">\n      <tool name=\"upwork__get_messages\" read_only=\"true\">\n        <description>Read messaging rooms, stories, threads, and conversation history.</description>\n      </tool>\n      <tool name=\"upwork__send_message\" read_only=\"false\">\n        <description>Send messages to active rooms, initiate direct conversations, or message applicants (clients).</description>\n        <actions>\n          <action name=\"send\" />\n          <action name=\"send_to_user\" />\n          <action name=\"message_proposal\" />\n          <action name=\"create_room\" />\n          <action name=\"edit\" />\n        </actions>\n      </tool>\n      <tool name=\"upwork__agency_rooms\" read_only=\"false\">\n        <description>Manage multi-user agency chat rooms and communication permissions.</description>\n      </tool>\n    </category>\n\n    <category name=\"Contracts, Offers &amp; Milestones\">\n      <tool name=\"upwork__list_contracts\" read_only=\"true\">\n        <description>Enumerate active, paused, and closed contracts.</description>\n      </tool>\n      <tool name=\"upwork__update_contract\" read_only=\"false\">\n        <description>Update weekly hourly limits or pause/resume contracts.</description>\n      </tool>\n      <tool name=\"upwork__end_contract\" read_only=\"false\">\n        <description>Close contracts and submit closing feedback.</description>\n      </tool>\n      <tool name=\"upwork__list_offers\" read_only=\"true\">\n        <description>List received client offers.</description>\n      </tool>\n      <tool name=\"upwork__respond_to_offer\" read_only=\"false\">\n        <description>Decline, counter-offer, or obtain the secure finalize_url to accept an offer on upwork.com.</description>\n        <actions>\n          <action name=\"accept\" />\n          <action name=\"decline\" />\n          <action name=\"request_changes\" />\n        </actions>\n      </tool>\n      <tool name=\"upwork__list_milestones\" read_only=\"true\">\n        <description>List active milestones for fixed-price contracts.</description>\n      </tool>\n      <tool name=\"upwork__manage_milestones\" read_only=\"false\">\n        <description>Create, edit, delete, or reject milestone deliverables.</description>\n      </tool>\n      <tool name=\"upwork__submit_milestones\" read_only=\"false\">\n        <description>Submit completed work for milestone approval and escrow release.</description>\n      </tool>\n      <tool name=\"upwork__manage_meetings\" read_only=\"false\">\n        <description>Request, schedule, reschedule, or cancel Upwork Zoom consultations.</description>\n      </tool>\n    </category>\n\n    <category name=\"Client &amp; Agency Marketplace Operations\">\n      <tool name=\"upwork__find_freelancers\" read_only=\"true\">\n        <description>Search global freelancer talent pool by skill, rate, rating, and location.</description>\n      </tool>\n      <tool name=\"upwork__post_job\" read_only=\"false\">\n        <description>Draft, update, and publish marketplace job postings.</description>\n      </tool>\n      <tool name=\"upwork__list_client_proposals\" read_only=\"true\">\n        <description>Review inbound proposals submitted to client job postings.</description>\n      </tool>\n      <tool name=\"upwork__manage_client_proposals\" read_only=\"false\">\n        <description>Shortlist, message, or decline proposals submitted by applicants.</description>\n      </tool>\n      <tool name=\"upwork__invite_freelancer\" read_only=\"false\">\n        <description>Send direct job invitations to specific freelancers.</description>\n      </tool>\n      <tool name=\"upwork__list_client_invitations\" read_only=\"true\">\n        <description>Track status of invitations sent to talent.</description>\n      </tool>\n      <tool name=\"upwork__manage_talent_lists\" read_only=\"false\">\n        <description>Curate and organize talent bookmarks and custom candidate shortlists.</description>\n      </tool>\n      <tool name=\"upwork__get_client_dashboard\" read_only=\"true\">\n        <description>Consolidated overview of client jobs, proposals, and messages.</description>\n      </tool>\n      <tool name=\"upwork__get_client_financials\" read_only=\"true\">\n        <description>Client escrow balances, billings, and payment transaction summaries.</description>\n      </tool>\n      <tool name=\"upwork__get_agency\" read_only=\"true\">\n        <description>Retrieve agency profile, rosters, and operational stats.</description>\n      </tool>\n      <tool name=\"upwork__update_agency\" read_only=\"false\">\n        <description>Update agency
