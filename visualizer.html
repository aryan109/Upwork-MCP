 branding, agency projects, and service offerings.</description>\n      </tool>\n      <tool name=\"upwork__get_agency_dashboard\" read_only=\"true\">\n        <description>Consolidated dashboard for agency activities, contracts, and proposals.</description>\n      </tool>\n    </category>\n  </tool_catalog>\n\n  <error_catalog>\n    <error code=\"VJ-JA-10\">\n      <name>Proposal Conflict Error</name>\n      <trigger>Calling manage_proposals action=create when an invitation or proposal already exists.</trigger>\n      <resolution>Call list_freelancer_proposals action=invitations first; use accept_invitation if invitation is present.</resolution>\n    </error>\n    <error code=\"filters_rejected\">\n      <name>Strict Taxonomy Rejection</name>\n      <trigger>Supplying non-canonical string in timezone or location filters.</trigger>\n      <resolution>Inspect response filters_rejected object to extract accepted canonical spelling and retry.</resolution>\n    </error>\n    <error code=\"filters_ignored\">\n      <name>Unmatched Skill Filter</name>\n      <trigger>Supplying a skill name that does not exist in Upwork's ontology.</trigger>\n      <resolution>Inspect response filters_ignored. If all skills were ignored, broaden terms or use query parameter.</resolution>\n    </error>\n    <error code=\"boost_below_recommended\">\n      <name>Insufficient Boost Bid</name>\n      <trigger>Bidding fewer Connects than preview.boost.recommended_connects.</trigger>\n      <resolution>Set boost_connects &gt;= recommended_connects or omit boosting entirely.</resolution>\n    </error>\n  </error_catalog>\n</upwork_mcp_specification>\n"}, {"name": "UPWORK_OVERHAUL_PLAN_by_claude.xml", "relpath": "UPWORK_OVERHAUL_PLAN_by_claude.xml", "category": "Strategy Overhaul Plans", "size_bytes": 37620, "content": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<upwork_overhaul_plan version=\"1.0\" generated_at=\"2026-10-04\">\n  <metadata>\n    <title>Upwork Overhaul Plan: Aryan P. (Top Rated, 100% JSS)</title>\n    <profile_url>https://www.upwork.com/freelancers/~01c405f48e970fd854</profile_url>\n    <mcp_reference>UPWORK_MCP_DOCUMENTATION.xml (this directory) and https://www.upwork.com/ai/mcp</mcp_reference>\n    <how_the_data_was_collected>\n      <item>Profile, My Stats and Proposals pages read on 2026-10-04 through the logged-in Chrome session.</item>\n      <item>Live job-market numbers taken on 2026-10-04 from Upwork job search and Project Catalog search in the same session (payment-verified clients, sorted by newest).</item>\n      <item>External evidence from Upwork's own research and help pages plus third-party pricing and digital-product sales data. Every source is listed in the sources section.</item>\n    </how_the_data_was_collected>\n    <reading_guide>\n      Each claim is tagged as one of three kinds. \"observed\" means read directly from Upwork on 2026-10-04.\n      \"cited\" means taken from a named external source. \"assumption\" means a planning estimate of mine that you must test; it is not proof.\n    </reading_guide>\n  </metadata>\n\n  <executive_summary>\n    <finding id=\"1\">\n      The profile has strong trust assets (Top Rated, 100% Job Success, 35 jobs, 20K+ USD earned) but the sales funnel is switched off:\n      0 proposals sent in the last 3 months, 0 profile views in the last 7 days, availability badge off, 12-month earnings of 2,172 USD.\n      The problem is activity and positioning, not reputation.\n    </finding>\n    <finding id=\"2\">\n      The profile and catalog are aimed at thin demand. \"OpenClaw\" returns 24 jobs across roughly two quarters, mostly under 1,000 USD.\n      Jobs with \"Claude\" in the title number 300 to 350 open postings, about 10 new per day. Reposition around Claude implementation\n      (Claude Code, Cowork, skills, MCP connectors) for businesses.\n    </finding>\n    <finding id=\"3\">\n      Premium AI jobs are crowded: most reach 20 to 50 or 50+ proposals within 2 to 5 days. The low-competition pockets are setup,\n      training, coaching, audits and tool-specific integrations, often posted by clients with 40K to 400K+ USD lifetime spend.\n      That is exactly where a done-for-you offer fits.\n    </finding>\n    <finding id=\"4\">\n      The done-for-you line is where the money is. The do-it-yourself pack is worth building, but the sales data says most packs earn very little\n      without an audience (median listed skill earns under 50 USD per month). Build the pack once as your delivery toolkit and credibility asset,\n      and treat its direct sales as a bonus.\n    </finding>\n    <finding id=\"5\">\n      Your 100% Job Success Score rests on a small recent base (about 2K USD in 12 months), and Upwork weights higher-earning jobs more heavily.\n      One bad outcome on a large contract would move the score a lot. The plan therefore starts every new client with a small paid first milestone.\n    </finding>\n    <honest_expectation>\n      Signing and funding a first contract inside 7 days is realistic. Cash in your bank inside 7 days is not, because of Upwork's payment holds\n      (see first_week_cash_reality). \"Huge money\" in week one is not supported by any evidence I found; a realistic first-month target is in the\n      targets section and is labelled as an assumption.\n    </honest_expectation>\n  </executive_summary>\n\n  <profile_audit kind=\"observed\">\n    <facts>\n      <fact name=\"badges\">Top Rated, 100% Job Success, identity verified</fact>\n      <fact name=\"totals\">20K+ USD total earnings, 35 total jobs, 395 total hours</fact>\n      <fact name=\"listed_rate\">120 USD per hour</fact>\n      <fact name=\"title\">AI Systems Architect | Agentic Workflows &amp; Enterprise Automation</fact>\n      <fact name=\"twelve_month_earnings\">2,172 USD</fact>\n      <fact name=\"proposals_last_3_months\">0 sent, 0 viewed, 0 interviews, 0 hires</fact>\n      <fact name=\"profile_views_last_7_days\">0</fact>\n      <fact name=\"availability_badge\">Off</fact>\n      <fact name=\"connects\">110. Freelancer Plus lapsed.</fact>\n      <fact name=\"open_invite\">1 unanswered invitation received 2026-08-31: \"Data Science &amp; GenAI Instructors for Live Online Training\"</fact>\n      <fact name=\"work_history\">30 completed, 5 in progress. Visible rates on recent hourly contracts: 25 to 30 USD per hour.</fact>\n      <fact name=\"largest_visible_contract\">WordPress OpenAI plugin, 4,408 USD, 176 hours at 25 USD per hour, rated 3.8, ended April 2024</fact>\n      <fact name=\"catalog\">OpenClaw Security Audit (from 250 USD), OpenClaw Private Agent Deployment (from 950 USD), AI Launchpad Blueprint (from 119 USD, sold once at 159 USD)</fact>\n      <fact name=\"portfolio\">Marlow chatbot, BandBuddy.AI dashboard and landing page (2023-era chatbot work)</fact>\n      <fact name=\"skills\">AI, Prompt Engineering, Generative AI, NLP, Software Architecture, Systems Engineering, ML, Chatbot Development, API Integration, Python, Scraping, OpenAI API, LangChain, Claude, Gemini</fact>\n      <fact name=\"consultations\">Enabled under Development &amp; IT. One 30-minute consultation sold at 30 USD in 2025.</fact>\n      <fact name=\"testimonials\">One external testimonial request pending since December 2022.</fact>\n    </facts>\n    <problems>\n      <problem id=\"P1\" severity=\"critical\">\n        <what>The funnel is off. No proposals, no badge, no views.</what>\n        <fix>Turn on the availability badge, reply to the open invite, and start the daily proposal routine in mcp_operating_system.</fix>\n      </problem>\n      <problem id=\"P2\" severity=\"critical\">\n        <what>Rate credibility gap. The profile says 120 USD per hour while every visible hourly contract is 25 to 30 USD per hour.</what>\n        <fix>\n          Lead with fixed-price packages, where the hourly history is not the comparison point. Set the profile rate to about 85 USD per hour\n          and bid 60 to 100 USD per hour on hourly jobs until three or more contracts at the new level are visible. This rate advice is my\n          recommendation based on the posted ranges in market_evidence, where premium Claude jobs cluster at 30 to 80 USD per hour with a few at 50 to 200.\n        </fix>\n      </problem>\n      <problem id=\"P3\" severity=\"high\">\n        <what>The title contains none of the words buyers type. Clients search \"Claude\", \"Claude Code\", \"AI agent\", \"n8n\", \"automation\".</what>\n        <fix>Use the title in the positioning section.</fix>\n      </problem>\n      <problem id=\"P4\" severity=\"high\">\n        <what>Two of three catalog projects are built on OpenClaw, which has almost no demand on Upwork.</what>\n        <fix>Replace them with the catalog projects in the offer_ladder section. Keep one OpenClaw/Hermes mention in the skills list for the few jobs that exist.</fix>\n      </problem>\n      <problem id=\"P5\" severity=\"high\">\n        <what>\n          Overview claims that a careful client can test and that may not hold up: \"over 8 years of deep technical experience\" sits next to a\n          degree dated 2017 to 2021 and employment starting 2020; \"100% GxP/HIPAA compliance\" is a guarantee no freelancer can give.\n        </what>\n        <fix>State only what the profile itself can back up. Replace guarantees with specifics: what you built, for whom, with what result.</fix>\n      </problem>\n      <problem id=\"P6\" severity=\"medium\">\n        <what>The overview opens by challenging the reader (\"are you just wasting money...\") and lists four unrelated service lines.</what>\n        <fix>Open with the outcome for one buyer type. One profile, one promise. Use a specialized profile for the second line of work.</fix>\n      </problem>\n      <problem id=\"P7\" severity=\"medium\">\n        <what>Portfolio shows 2023 chatbots. Nothing shows Claude, agents, skills or MCP work.</what>\n        <fix>Add three case studies in week one (see seven_day_launch day 2). The Upwork MCP documentation in this repository is one of them.</fix>\n      </problem>\n      <problem id=\"P8\" severity=\"medium\">\n        <what>The 3.8-rated contract is the largest visible job. It ended April 2024, so it is now outside the 24-month Job Success window, but clients still see it.</what>\n        <fix>Check your Top Rated perks page for the feedback-removal option and use it on this contract if you are eligible. Verify eligibility on Upwork; I did not confirm it.</fix>\n      </problem>\n      <problem id=\"P9\" severity=\"low\">\n        <what>Missing skills tags: Claude Code, AI Agent Development, Model Context Protocol, n8n, Retrieval-Augmented Generation, AI Consulting, Automation.</what>\n        <fix>Add the ones Upwork's skill list accepts and drop generic ones (Systems Engineering, Gemini) to make room.</fix>\n      </problem>\n    </problems>\n  </profile_audit>\n\n  <market_evidence>\n    <live_upwork_job_data kind=\"observed\" date=\"2026-10-04\" filter=\"payment verified, newest first\">\n      <query term=\"title contains: claude\">\n        <volume>7 result pages at 50 per page, so roughly 300 to 350 open jobs. The 50 newest were all posted within 5 days: about 10 new jobs per day.</volume>\n        <note>Budgets vary widely: many 20 to 400 USD placeholders, alongside 30 to 200 USD per hour roles from clients with 40K to 400K+ USD spend.</note>\n      </query>\n      <query term=\"&quot;claude code&quot;, hourly ceiling 50+ USD or fixed 1,000+ USD\">\n        <volume>3 result pages (100 to 150 jobs). About 20 posted in the last 6 days.</volume>\n        <note>Most were at 20 to 50 or 50+ proposals within 3 to 5 days.</note>\n      </query>\n      <query term=\"&quot;AI agent&quot;, hourly ceiling 75+ USD or fixed 3,000+ USD\">\n        <volume>2 result pages (50 to 100 jobs). About 15 posted in the last week. Fixed budgets seen: 3,000 / 5,000 / 15,000 / 20,000 USD. Hourly up to 100 to 300 USD.</volume>\n        <note>The 15K and 20K jobs already had 50+ proposals at 2 to 5 days old.</note>\n      </query>\n      <query term=\"&quot;MCP server&quot;, hourly ceiling 50+ USD or fixed 1,000+ USD\">\n        <volume>8 jobs in 2 months.</volume>\n        <note>MCP is a feature inside Claude and agent jobs. It is too thin to be a headline.</note>\n      </query>\n      <query term=\"openclaw (all budgets)\">\n        <volume>24 jobs in about two quarters. Typical budgets 50 to 1,000 USD. Two exceptions: 75 to 150 USD per hour (Hermes) and one 10,000 USD build.</volume>\n      </query>\n      <query term=\"title contains: upwork, plus bidder / proposals / lead generation / MCP / automation\">\n        <volume>2 result pages (50 to 100 jobs), about 20 new per week. Many with fewer than 5 proposals.</volume>\n        <note>Most posters show 0 to 1K USD lifetime spend. They are freelancers and small agencies with small budgets. Good audience for a DIY kit, weak audience for high-ticket work.</note>\n      </query>\n      <low_competition_examples>\n        <example title=\"Install and Configure Claude Code + OpenAI Codex on My Windows PC\" client_spend=\"100K+\" proposals=\"fewer than 5\" budget=\"50 USD fixed (placeholder)\"/>\n        <example title=\"Claude certified expert to record training for Claude certified architect\" client_spend=\"20K+\" proposals=\"5 to 10\" budget=\"30 to 60 USD per hour\"/>\n        <example title=\"Marketing automation specialist for an SEO agency: Claude Team, ClickUp, Google Workspace\" client_spend=\"2K+\" proposals=\"5 to 10\" budget=\"400 USD fixed\"/>\n        <example title=\"AI Appointment Setter &amp; B2B Data Expert for Recruiting Clients (runs on Claude Code)\" client_spend=\"new client\" proposals=\"5 to 10\" budget=\"100 to 300 USD per hour\"/>\n        <example title=\"AI Content &amp; Strategy Manager\" client_spend=\"9K+\" proposals=\"10 to 15\" budget=\"2,500 USD fixed\"/>\n      </low_competition_examples>\n      <high_value_buyer_examples note=\"these show who pays; several already had 50+ proposals, so speed matters\">\n        <example title=\"Claude AI Implementation Expert: Team Setup, Security, AI Agents &amp; Business Workflows\" client_spend=\"400K+\"/>\n        <example title=\"AI Operations Auditor: Assess Our Claude-Based Business OS\" client_spend=\"200K+\" budget=\"30 to 40 USD per hour\"/>\n        <example title=\"AI Specialist to Configure Agency Operations (reporting, ad updates, billing)\" client_spend=\"100K+\" budget=\"2,500 USD fixed\"/>\n        <example title=\"AI/Claude Implementation Specialist for UK Outsourced Finance Firm\" client_spend=\"40K+\" budget=\"30 to 80 USD per hour\"/>\n        <example title=\"Code Review &amp; Go-Live Check for a Claude Code-Built Next.js + Supabase App\" client_spend=\"100K+\"/>\n        <example title=\"Senior AI Systems Engineer: Claude-Powered Appraisal Production System\" client_spend=\"70K+\" budget=\"50 to 200 USD per hour\"/>\n        <example title=\"Claude Code and N8N Coach\" client_spend=\"40K+\"/>\n        <example title=\"Hands-On Coach: Linear + Claude Code/Codex Software Factory\" client_spend=\"6K+\" budget=\"25 to 100 USD per hour\"/>\n        <example title=\"Build Personal RAG System for Medicolegal Reports (Claude)\" client_spend=\"new client\" budget=\"7,000 USD fixed\"/>\n        <example title=\"Claude Cowork Expert: Run Portal Workflows Unattended\" client_spend=\"400K+\" budget=\"100 USD fixed (placeholder)\"/>\n      </high_value_buyer_examples>\n    </live_upwork_job_data>\n\n    <project_catalog_data kind=\"observed\" date=\"2026-10-04\">\n      <stat term=\"claude\">9,110 catalog projects</stat>\n      <stat term=\"ai agent\">13,277 catalog projects</stat>\n      <pattern>Top listings start at 99 to 150 USD with 1 to 3 day delivery, from sellers showing 100 to 1,200+ reviews. Titles are generic (\"Claude AI Developer | Claude API | Claude Code\").</pattern>\n      <implication>You cannot win the catalog on price or review count. Win it with a specific outcome for a specific buyer, priced above the 99 USD crowd.</implication>\n    </project_catalog_data>\n\n    <external_evidence kind=\"cited\">\n      <point source=\"S1\">Upwork In-Demand Skills 2026: demand for skills that explicitly mention AI grew 109% year over year, against 23% for all other skills. AI integration grew 178%; AI chatbot development grew 71%.</point>\n      <point source=\"S2\">Upwork launched its MCP server on 2026-08-10. It is free for all users, works with Claude, ChatGPT and Cursor, and every action that changes something needs user confirmation.</point>\n      <point source=\"S3\">Agency pricing benchmark from 48 agencies that publish prices: a single workflow starts around 1,000 USD, a multi-workflow project around 3,556 USD, an ongoing retainer around 1,423 USD per month.</point>\n      <point source=\"S4\">SKILL.md marketplaces, Q1 to Q2 2026: top skills earn roughly 500 to 3,000 USD per month, the median listed skill earns under 50 USD per month, and most revenue sits in the top 10% of listings. Typical price 5 to 25 USD per skill. Sellers that do well encode specific opinions and workflows; simple prompt wrappers do poorly.</point>\n      <point source=\"S5\">Gumroad: revenue is extremely top-heavy. The top 1% of products take about 77% of revenue. One curated n8n template pack raised its price from 15 to 100 USD after 194 sales; a bare 8,000-template pack at about 10 USD shows 311 sales.</point>\n      <point source=\"S6\">Skills bundles on the market today are priced from 9 to 167 USD.</point>\n    </external_evidence>\n\n    <verdict>\n      <supported>Demand for Claude implementation work on Upwork is real, growing and visible daily. Buyers with large Upwork spend are posting it.</supported>\n      <supported>Small and mid-size done-for-you engagements (1,000 to 7,500 USD) match both the Upwork postings and the outside pricing benchmarks.</supported>\n      <not_supported>Nothing I found supports a DIY pack earning large sums quickly without an existing audience.</not_supported>\n      <not_supported>Very high-ticket work (15K+ USD) exists on Upwork but draws 50+ proposals fast. Expect it to come from expanding existing clients, not from cold proposals.</not_supported>\n    </verdict>\n  </market_evidence>\n\n  <positioning>\n    <core_promise>I set up Claude so your team uses it every day: connected to your tools, with custom skills for your workflows, documented and handed over.</core_promise>\n    <target_buyers basis=\"my reading of a small sample of live postings; test and adjust\">\n      <buyer>Professional-services firms: accounting and finance firms, agencies (marketing, SEO, recruiting), law firms.</buyer>\n      <buyer>Founders who built something with Claude Code and need review, hardening or coaching.</buyer>\n      <buyer>Operations leads who bought Claude Team/Cowork seats and are not getting value from them.</buyer>\n    </target_buyers>\n    <new_title>Claude AI Implementation | Claude Code, Skills &amp; MCP | AI Agents &amp; Automation</new_title>\n    <overview_structure>\n      <line order=\"1\">First two lines (all a client sees in search): who you help and the outcome. Example: \"I set up Claude for business teams: Claude Code, Cowork, custom skills and MCP connectors to your CRM, inbox and docs, so work that took hours runs in minutes. Top Rated, 100% Job Success.\"</line>\n      <line order=\"2\">Three packaged offers with scope and timeline (Setup Sprint, AI Operations Audit, Done-For-You Implementation).</line>\n      <line order=\"3\">Three proof bullets, each one a real project with a number. Use only results you can show.</line>\n      <line order=\"4\">How you work: fixed scope, written acceptance criteria, recorded handover, 14 days of support.</line>\n      <line order=\"5\">Call to action: book a consultation or send the workflow you want automated.</line>\n      <remove>The \"8 years\" claim unless it is accurate and you can show it; the \"100% GxP/HIPAA compliance\" guarantee; the opening challenge to the reader; OpenClaw as a headline.</remove>\n    </overview_structure>\n    <specialized_profiles>\n      <profile name=\"AI Agent &amp; Automation Development\">For build-heavy jobs: agents, RAG, n8n, API integration. Keeps the general profile focused on Claude implementation.</profile>\n      <profile name=\"AI Training &amp; Coaching\">For the coaching and training postings, which showed the lowest proposal counts.</profile>\n    </specialized_profiles>\n    <rate_strategy>\n      <rule>Profile rate about 85 USD per hour until the visible history supports more.</rule>\n      <rule>Prefer fixed-price packages. They remove the hourly comparison and are easier to protect with acceptance criteria.</rule>\n      <rule>Raise the rate after every three completed contracts at the current level.</rule>\n    </rate_strategy>\n  </positioning>\n\n  <offer_ladder>\n    <principle>One body of work, sold three ways. The DIY kit is the same set of skills, templates and documents you use to deliver the done-for-you work. Build it once.</principle>\n\n    <done_for_you>\n      <offer id=\"DFY1\" name=\"Claude Setup Sprint\" price=\"299 to 1,200 USD fixed\" delivery=\"2 to 3 days\" channel=\"Project Catalog and proposals\">\n        <scope>Install and configure Claude Code or Cowork, connect 1 to 3 tools through MCP connectors, build 1 to 5 custom skills for the client's real workflows, one recorded training session, a written runbook.</scope>\n        <tiers>Starter 299 USD (setup + 1 skill). Standard 599 USD (setup + 3 skills + 1 connector + training). Team 1,200 USD (up to 5 users, 5 skills, 3 connectors).</tiers>\n        <role>Door-opener. Fast, low dispute risk, produces 5-star outcomes quickly.</role>\n        <evidence>Setup and connector postings appear daily (Claude Code install, Claude Code to HubSpot MCP, Claude + GA4, Claude Team + ClickUp).</evidence>\n      </offer>\n      <offer id=\"DFY2\" name=\"AI Operations Audit\" price=\"750 to 1,500 USD fixed\" delivery=\"3 to 5 days\" channel=\"proposals and catalog\">\n        <scope>Review the client's current Claude or agent setup, or a Claude Code-built app. Deliver a written findings report, a prioritized fix list, and a costed roadmap.</scope>\n        <role>Paid discovery. This is the safe first milestone before any large build.</role>\n        <evidence>\"AI Operations Auditor: Assess Our Claude-Based Business OS\" (200K+ client); \"Code Review &amp; Go-Live Check for a Claude Code-Built App\" (100K+ client); \"OpenClaw AI Automation QA Lead: Technical Audit\" (800K+ client).</evidence>\n      </offer>\n      <offer id=\"DFY3\" name=\"Done-For-You Claude Implementation\" price=\"3,000 to 7,500 USD fixed, in 3 milestones\" delivery=\"2 to 4 weeks\" channel=\"proposals, upsell from DFY1 and DFY2\">\n        <scope>Team rollout, security and permissions, 8 to 15 custom skills, agents for 2 to 4 core workflows, connectors to CRM, inbox, docs and accounting, documentation, training, 14 days of support.</scope>\n        <evidence>\"Claude AI Implementation Expert: Team Setup, Security, AI Agents &amp; Business Workflows\" (400K+ client); agency operations configuration at 2,500 USD; outside benchmark of about 3,556 USD for a multi-workflow project (S3).</evidence>\n      </offer>\n      <offer id=\"DFY4\" name=\"AI Operations Care Plan\" price=\"1,000 to 2,500 USD per month\" channel=\"existing clients only\">\n        <scope>Fixed monthly hours for new skills, fixes, model and tool updates, and a monthly review call.</scope>\n        <role>Recurring income, and long-term relationships help the Job Success Score (S7).</role>\n        <evidence>Outside benchmark of about 1,423 USD per month for an ongoing retainer (S3).</evidence>\n      </offer>\n      <offer id=\"DFY5\" name=\"Claude Coaching and Team Training\" price=\"100 to 150 USD per hour, or 750 USD per workshop\" channel=\"Consultations, proposals\">\n        <evidence>Coaching and training postings showed the lowest competition in the sample (several at 5 to 20 proposals).</evidence>\n      </offer>\n    </done_for_you>\n\n    <do_it_yourself>\n      <product id=\"DIY1\" name=\"Claude Business OS Kit\">\n        <contents>\n          <item>12 to 20 SKILL.md skills for business operations: inbox triage, meeting notes to CRM, proposal drafting, client reporting, invoice chasing, research briefs, content repurposing, SOP writer.</item>\n          <item>CLAUDE.md and project-instruction templates for teams.</item>\n          <item>Connector setup guides for the tools that appeared most in the job postings: HubSpot, Google Workspace, ClickUp, GoHighLevel, Zoho, QuickBooks.</item>\n          <item>A prompt library organized by role.</item>\n          <item>A setup checklist, a security and permissions guide, and short walkthrough videos.</item>\n        </contents>\n        <pricing>Core 49 USD. Pro 149 USD (all skills + guides + videos). Pro plus a 30-minute setup call 299 USD.</pricing>\n        <rule_for_what_sells source=\"S4\">Each skill must encode a specific, opinionated workflow. Generic prompt wrappers do not sell.</rule_for_what_sells>\n      </product>\n      <product id=\"DIY2\" name=\"Upwork MCP Proposal Engine Kit\">\n        <contents>The documentation already in this repository, turned into a product: skills for job discovery, client vetting, proposal drafting and Connects budgeting through the official Upwork MCP, with the human-confirmation step kept in.</contents>\n        <pricing>29 to 79 USD.</pricing>\n        <audience>Freelancers and small agencies. About 20 new \"Upwork bidder / profile optimization\" postings per week show the need, but posters have small budgets, so sell this as a kit, not as a service.</audience>\n        <compliance>Never offer to log in to or bid from someone else's Upwork account, and never sell unattended auto-bidding. Sell setup and templates for the buyer's own account with confirmation on every submission.</compliance>\n      </product>\n      <channels>\n        <off_upwork>Gumroad or Lemon Squeezy with a private repository, plus one SKILL.md marketplace. Promote through GitHub (free sample skills in a public repo), LinkedIn and short demo videos.</off_upwork>\n        <on_upwork>Sell the kit only as a customized service through Project Catalog (\"You will get a Claude skills pack customized for your business\"). Do not paste store links into proposals, messages or the profile.</on_upwork>\n        <hard_rule source=\"S8\">Keep the two channels separate. A client who found you on Upwork pays through Upwork for 24 months unless the conversion fee is paid. Do not share contact details before a contract starts.</hard_rule>\n      </channels>\n      <realistic_expectation kind=\"assumption\">\n        With no existing audience, plan for 0 to 300 USD per month from the kits in the first two months. The kit pays for itself by cutting\n        done-for-you delivery time and by serving as proof in proposals.\n      </realistic_expectation>\n    </do_it_yourself>\n  </offer_ladder>\n\n  <seven_day_launch>\n    <budget>About 80 to 110 USD: Freelancer Plus (about 20 USD per month; confirm current terms on the upgrade page) and 400 to 600 extra Connects at 0.15 USD each. Typical proposals cost 16 to 20 Connects, so your current 110 covers only 5 to 7 proposals (S9).</budget>\n    <day number=\"1\" theme=\"Switch the funnel on\">\n      <task>Rewrite title, overview and skills as in positioning. Set the rate.</task>\n      <task>Turn on the availability badge.</task>\n      <task>Answer or decline the invitation from 2026-08-31. It costs 0 Connects.</task>\n      <task>Review the 5 in-progress contracts. For any that are finished, confirm the client is happy, then ask them to close it with feedback.</task>\n      <task>Check the Top Rated perks page for feedback removal on the 3.8-rated contract.</task>\n    </day>\n    <day number=\"2\" theme=\"Proof\">\n      <task>Publish three portfolio case studies with screenshots or a short screen recording: (1) the Upwork MCP documentation and proposal engine in this repository, (2) a Claude skills and connector setup you build for your own company as a live demo, (3) your strongest agent or RAG build.</task>\n      <task>Record one 2-minute demo video of Claude running a real business workflow end to end. Reuse it in every proposal.</task>\n    </day>\n    <day number=\"3\" theme=\"Catalog and past clients\">\n      <task>Replace the two OpenClaw catalog projects with Claude Setup Sprint and AI Operations Audit. Rename AI Launchpad to match the new positioning.</task>\n      <task>Message past clients who rated you 5.0 through their existing Upwork message rooms with one specific offer (the Setup Sprint). This is the highest-probability path to a contract in week one, and repeat clients help the Job Success Score.</task>\n    </day>\n    <day number=\"4-7\" theme=\"Daily proposal routine\">\n      <task>Send 4 to 6 vetted proposals per day using the routine in mcp_operating_system. Work the 18:30 to 23:30 IST window, when US clients post.</task>\n      <task>Apply only to jobs under 15 proposals and under 24 hours old that pass the client scorecard.</task>\n      <task>Build the first 5 skills of the DIY kit in parallel. They double as delivery assets for the first Setup Sprint.</task>\n    </day>\n    <first_week_cash_reality>\n      Upwork holds fixed-price payments for a security period after a milestone is approved (5 days under the standard schedule), and bills hourly\n      work weekly with funds available about 10 days after the week ends. Confirm the current schedule in your Upwork payment settings.\n      A contract signed on day 3 with a milestone approved on day 6 pays out around day 11.\n    </first_week_cash_reality>\n  </seven_day_launch>\n\n  <targets kind=\"assumption\">\n    <note>These are planning numbers to measure against. They are not forecasts backed by data.</note>\n    <week number=\"1\">25 to 30 proposals sent, 1 to 2 contracts signed, 300 to 1,500 USD contracted.</week>\n    <month number=\"1\">2 to 4 Setup Sprints, 1 to 2 Audits, 1 implementation started: 3,000 to 8,000 USD contracted.</month>\n    <month number=\"3\">1 to 2 care-plan retainers running, rate history visible at the new level, 6,000 to 12,000 USD per month.</month>\n    <checkpoints basis=\"my rules of thumb\">\n      <check>After 20 proposals: if fewer than 6 were viewed, the targeting or the first two lines of the proposal are wrong. Change those first.</check>\n      <check>If proposals are viewed but get no replies: the offer or price is wrong for that job type. Test the Audit as the entry offer.</check>\n      <check>If calls happen but do not close: tighten scope and lower the size of the first milestone.</check>\n      <check>Track weekly on the My Stats page: proposals sent, viewed, interviews, hires, profile views, invites.</check>\n    </checkpoints>\n  </targets>\n\n  <job_success_protection>\n    <how_jss_works kind=\"cited\" source=\"S7\">\n      <rule>Calculated daily over 6, 12 and 24 months; the best of the three is shown.</rule>\n      <rule>Based on client feedback, the reasons contracts ended, higher-value projects and long-term relationships.</rule>\n      <rule>Jobs with higher earnings have a bigger impact.</rule>\n      <rule>Contracts with rate changes can have a greater impact, in either direction.</rule>\n      <rule>Long-term relationships can raise the score; not having them does not lower it.</rule>\n      <rule>Feedback from clients Upwork has flagged for poor collaboration, or suspended, does not count against you.</rule>\n      <rule>Private feedback counts as well as public feedback (S10). You never see the private score, so a polite 5-star public review does not guarantee a good outcome.</rule>\n      <rule>A score below 90% loses the Top Rated track; below 79% makes winning work hard.</rule>\n    </how_jss_works>\n    <your_specific_risk>\n      Your recent base is small (about 2K USD in 12 months), so the next few contracts carry most of the weight, and a large one carries the most.\n      Do not let the first contract with a new client be a 5,000+ USD build.\n    </your_specific_risk>\n    <client_scorecard use=\"before spending Connects; every item is visible on the job page or via MCP find_jobs action=get\">\n      <must_pass>Payment verified.</must_pass>\n      <must_pass>Client rating from freelancers 4.7 or higher, or a new client with a detailed, specific post.</must_pass>\n      <must_pass>Hire rate 50% or higher for clients with history.</must_pass>\n      <must_pass>Read the feedback this client has given other freelancers. If they regularly give 4.0 to 4.5 with complaints, skip, whatever the budget.</must_pass>\n      <must_pass>Average hourly rate paid is not far below your rate.</must_pass>\n      <must_pass>Nobody hired yet, and under 15 proposals.</must_pass>\n      <red_flag>Tiny budget with large scope and urgency. A live example from today: a 100 USD fixed budget to finish a full marketplace in 7 days, with \"we expect perfection\" and \"submit your very best price\".</red_flag>\n      <red_flag>\"Best price\" or \"lowest bid\" language, unpaid test work, requests to talk or pay outside Upwork.</red_flag>\n      <red_flag>Scope that cannot be written as acceptance criteria.</red_flag>\n      <red_flag>Commission-only or equity-only pay.</red_flag>\n      <note>A placeholder budget (5 to 100 USD) from a client with 100K+ USD spend is not a red flag by itself. Quote your real price.</note>\n    </client_scorecard>\n    <contract_rules>\n      <rule>Start every new client with a small fixed milestone (Setup Sprint or Audit). Take the large build only after that milestone ends well.</rule>\n      <rule>Write acceptance criteria into the first message of the contract: what is delivered, how it is tested, two revision rounds.</rule>\n      <rule>Keep the rate fixed inside a contract. Rate changes increase that contract's weight (S7). Open a new contract for a new rate.</rule>\n      <rule>On hourly contracts, log time with the Upwork tracker so hourly payment protection applies.</rule>\n      <rule>Send a short written update at least twice a week and a recorded demo at each milestone.</rule>\n      <rule>Use Upwork's mid-contract feedback request on longer contracts to catch problems early.</rule>\n      <rule>Before closing, ask plainly: \"Is there anything that would stop you rating this 10 out of 10?\" Fix it, then ask the client to close the contract.</rule>\n      <rule>If a client is unhappy, offer a fix first. A refund does not by itself remove the outcome; read Upwork's guidance in S7 before refunding.</rule>\n      <rule>Do not leave finished contracts open and idle. Close them with feedback.</rule>\n      <rule>Keep all payment on Upwork for Upwork-sourced clients (S8).</rule>\n    </contract_rules>\n  </job_success_protection>\n\n  <mcp_operating_system reference=\"UPWORK_MCP_DOCUMENTATION.xml, job_proposal_automation_engine stages 1 to 5\">\n    <account_warning>\n      The Upwork connector in this Claude session is authorized to a different Upwork account (shown as \"Patrick H.\"), not to the Aryan P. profile.\n      Reconnect the connector while logged in as Aryan P. before using any MCP step below. No change was made to any Upwork account while preparing this plan.\n    </account_warning>\n    <daily_routine runs=\"3 times in the evening IST window\">\n      <step number=\"1\" tool=\"find_jobs\" action=\"smart_search\">mode=most_recent, days_posted=1, verified_payment_only=true. Then action=search with title terms \"claude\", \"AI agent\", \"automation\", proposals_max=15, client_hires_min=1, sort=recency.</step>\n      <step number=\"2\" tool=\"find_jobs\" action=\"get\">Score each job against the client scorecard using client_record (total spent, hire rate, rating), activityStat.jobActivity (hired, offered, interviewing) and client_feedback.</step>\n      <step number=\"3\" tool=\"list_freelancer_proposals\" action=\"invitations, then list\">Check for an existing invite or proposal to avoid error VJ-JA-10.</step>\n      <step number=\"4\" tool=\"manage_proposals\" action=\"create\">Draft with the proposal template below. Attach the matching portfolio item. Boost only when the preview recommends it and the job passed every must_pass item.</step>\n      <step number=\"5\" tool=\"confirm_preview\">You read the draft, the Connects cost and the bid, then confirm. Nothing is submitted without your approval.</step>\n    </daily_routine>\n    <proposal_template>\n      <line order=\"1\">One sentence that restates the client's goal in their own words, using their name if the client's reviews reveal it.</line>\n      <line order=\"2\">One sentence of matching proof with a number, plus the demo video link from your Upwork portfolio.</line>\n      <line order=\"3\">The plan in three steps with a timeline.</line>\n      <line order=\"4\">A fixed first milestone with price (Setup Sprint or Audit).</line>\n      <line order=\"5\">One specific question about their setup.</line>\n      <length>Under 150 words. No list of technologies.</length>\n    </proposal_template>\n    <connects_budget>Cap at 100 Connects per day. Stop boosting if a week of boosted proposals shows no better view rate than unboosted ones.</connects_budget>\n  </mcp_operating_system>\n\n  <limits_of_this_analysis>\n    <limit>Job counts come from Upwork search on one day and are approximate. Search matches loosely and may cap results.</limit>\n    <limit>I read page 1 of 3 of your work history and portfolio, not all of it.</limit>\n    <limit>The buyer segments are inferred from a sample of roughly 150 postings.</limit>\n    <limit>Targets, checkpoints and the DIY revenue range are assumptions. No source proves a specific income.</limit>\n    <limit>Upwork fees, Connects pricing, Freelancer Plus terms, payment holds and Top Rated perks change. Confirm each on Upwork before relying on it.</limit>\n  </limits_of_this_analysis>\n\n  <sources>\n    <source id=\"S1\" url=\"https://www.upwork.com/research/in-demand-skills-2026\">Upwork, In-Demand Skills 2026</source>\n    <source id=\"S1b\" url=\"https://investors.upwork.com/news-releases/news-release-details/upworks-demand-skills-2026-demand-top-ai-skills-more-doubles-ai\">Upwork press release on In-Demand Skills 2026</source>\n    <source id=\"S2\" url=\"https://www.upwork.com/press/releases/upwork-talent-is-now-everywhere-ai-works\">Upwork press release, MCP server launch, 2026-08-10</source>\n    <source id=\"S3\" url=\"https://aumiqx.com/services/ai-automation-agency/\">AI automation agency 2026 pricing data (48 agencies)</source>\n    <source id=\"S4\" url=\"https://www.agensi.io/learn/how-to-monetize-skill-md-skills-developer-guide-2026\">How to Monetize SKILL.md Skills, 2026 guide</source>\n    <source id=\"S5\" url=\"https://affstudio.org/2026/06/17/best-n8n-templates-to-sell-in-2026-15-automation-ideas-that-businesses-actually-pay-for/\">n8n template sales examples; Gumroad distribution figures from https://insightraider.com/en/answers/can-you-sell-notion-templates-on-gumroad</source>\n    <source id=\"S6\" url=\"https://www.agentskillpacks.com/\">Skill pack price points; also https://inflectual.gumroad.com/l/master-marketing-claude-skills-bundle</source>\n    <source id=\"S7\" url=\"https://support.upwork.com/hc/en-us/articles/211068358-All-about-your-Job-Success-Score\">Upwork Help, All about your Job Success Score</source>\n    <source id=\"S8\" url=\"https://conductatlas.com/platform/upwork/upwork-terms-of-service/non-circumvention-and-conversion-fee/\">Upwork Terms of Service, section 7, non-circumvention (24 months) and conversion fee</source>\n    <source id=\"S9\" url=\"https://golance.com/blogs/upwork-fees-explained-2026\">Upwork fees 2026: variable 0 to 15% freelancer fee, Connects at 0.15 USD, Freelancer Plus; proposal cost range from https://upcat.app/upwork-fees-explained/</source>\n    <source id=\"S10\" url=\"https://support.upwork.com/hc/en-us/articles/38437546570643-When-will-I-get-a-JSS\">Upwork Help, Job Success Score eligibility and feedback types</source>\n  </sources>\n</upwork_overhaul_plan>\n"}, {"name": "UPWORK_OVERHAUL_PLAN_v2_by_claude.xml", "relpath": "UPWORK_OVERHAUL_PLAN_v2_by_claude.xml", "category": "Strategy Overhaul Plans", "size_bytes": 42385, "content": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<upwork_overhaul_plan version=\"2.0\" generated_at=\"2026-10-04\">\n  <metadata>\n    <title>Upwork Overhaul Plan: Aryan P. (Top Rated, 100% JSS)</title>\n    <profile_url>https://www.upwork.com/freelancers/~01c405f48e970fd854</profile_url>\n    <mcp_reference>UPWORK_MCP_DOCUMENTATION.xml (this directory) and https://www.upwork.com/ai/mcp</mcp_reference>\n    <how_the_data_was_collected>\n      <item>Your profile (all 3 pages of work history, in-progress contracts), My Stats, Job Success insights and Proposals pages, read on 2026-10-04 in the logged-in Chrome session.</item>\n      <item>Exact marketplace counts from the filter sidebar of Upwork job search on 2026-10-04 (payment-verified clients).</item>\n      <item>Upwork talent search and one competitor profile; two full job posts including client history; Project Catalog search; Gumroad search; the official Upwork MCP page.</item>\n      <item>Upwork help and research pages, plus third-party pricing and sales data. All sources are listed at the end.</item>\n    </how_the_data_was_collected>\n    <reading_guide>\n      \"observed\" means read directly from a live page on 2026-10-04. \"cited\" means taken from a named external source.\n      \"assumption\" means a planning estimate of mine that you must test; it is not proof.\n    </reading_guide>\n    <changes_from_version_1>\n      <change>The proposals statistic is corrected: My Stats shows 0 proposals in the last 7 days, with the last proposal activity about 3 months ago.</change>\n      <change>Rough job counts are replaced with exact counts. They show that posted budgets are lower than version 1 implied.</change>\n      <change>The Job Success section now uses the exact weighting rules from your own insights page.</change>\n      <change>Recommended profile rate lowered from 85 to 65 USD per hour, with the reasoning shown.</change>\n      <change>Added: competitor analysis, a real freelancer whose history matches the proposed ladder, stale-contract reactivation, the average-hourly-paid client check, Gumroad data, certification option.</change>\n      <change>Corrected a source error: the \"167\" in the marketing skills bundle is the number of skills, not its price.</change>\n    </changes_from_version_1>\n  </metadata>\n\n  <executive_summary>\n    <finding id=\"1\">\n      Your reputation is strong but the funnel is off: 0 proposals in the last 7 days (last activity about 3 months ago), 0 profile views in 7 days,\n      availability badge off, 12-month earnings of 2,172 USD.\n    </finding>\n    <finding id=\"2\">\n      Demand is real: 313 open jobs have \"Claude\" in the title and 404 have \"AI agent\". OpenClaw, which two of your three catalog projects target, shows 24 jobs in about two quarters.\n    </finding>\n    <finding id=\"3\">\n      Posted budgets are low. Of 215 hourly Claude-title jobs, only 46 allow 50 USD per hour or more, and only 9 allow 100 USD or more.\n      Of 98 fixed-price ones, only 14 are 1,000 USD or more. Your 120 USD per hour listing sits above almost every posted ceiling.\n    </finding>\n    <finding id=\"4\">\n      High earnings on Upwork in this niche come from package pricing, expansion inside a client, and retainers, not from a high hourly sticker.\n      A comparable freelancer (Top Rated Plus, 95 USD per hour, 105 jobs in 597 hours) shows exactly this pattern in public history:\n      fixed jobs of 220 to 1,700 USD, then a 10,400 USD hourly engagement with one agency.\n    </finding>\n    <finding id=\"5\">\n      Your Job Success Score is easier to protect than version 1 suggested. Upwork caps the weight of a large job at 1.5 jobs,\n      a job of 251 USD or more counts as 1.25 jobs, and a client who pays you again more than 90 days after their first payment makes\n      all jobs with that client count as successful. You have 5 open contracts from 2023 and 2024 that qualify for that rule if they pay again.\n    </finding>\n    <finding id=\"6\">\n      The do-it-yourself pack will not earn much by itself. Gumroad lists 815 products for \"claude skills\"; the best sellers show 0 to 6 ratings and many are free.\n      Build it as your delivery toolkit and a free-sample lead magnet.\n    </finding>\n    <honest_expectation>\n      A signed and funded contract inside 7 days is realistic, most likely from a past client. Cash in the bank inside 7 days is not, because of Upwork's\n      payment holds. I found no evidence supporting \"huge money\" in week one. Targets are in the targets section and are assumptions.\n    </honest_expectation>\n  </executive_summary>\n\n  <profile_audit kind=\"observed\">\n    <facts>\n      <fact name=\"badges\">Top Rated, 100% Job Success (as of 2026-10-04), identity verified</fact>\n      <fact name=\"totals\">20K+ USD total earnings, 35 total jobs, 395 hours</fact>\n      <fact name=\"listed_rate\">120 USD per hour</fact>\n      <fact name=\"visible_hourly_history\">3, 5, 12, 20, 25 and 30 USD per hour. No visible contract above 30.</fact>\n      <fact name=\"twelve_month_earnings\">2,172 USD</fact>\n      <fact name=\"proposals\">0 sent in the last 7 days; last activity about 3 months ago; 0 submitted proposals outstanding</fact>\n      <fact name=\"profile_views_last_7_days\">0</fact>\n      <fact name=\"availability_badge\">Off</fact>\n      <fact name=\"connects\">110. Freelancer Plus lapsed. Live job posts cost 15 to 20 Connects each.</fact>\n      <fact name=\"open_invite\">1 unanswered invitation from 2026-08-31: \"Data Science &amp; GenAI Instructors for Live Online Training\"</fact>\n      <fact name=\"jss_base\">8 eligible jobs and 16 clients inside the 24-month window</fact>\n      <fact name=\"largest_job\">7,000 USD fixed price for an Upwork enterprise client (2023). The same enterprise client appears on at least 6 contracts through 2025, including 1,950 USD and 300 USD.</fact>\n      <fact name=\"in_progress_contracts\">\n        5 open contracts with no recent activity: Finetune GPT-3 model (since Jan 2023, 590 USD), Scraping and warehousing of Data (Apr 2023, 1,175 USD),\n        AI chat-bot development (Jul 2023, 900 USD), AI Solutions Designer and Prompt Engineer (Aug 2023, 175 USD), Phase 1 of Web App Scraper (Dec 2024, 120 USD).\n      </fact>\n      <fact name=\"ratings_below_five\">3.8 on the 4,408 USD WordPress plugin (ended Apr 2024), 3.8 on a 125 USD AutoGPT plugin, 3.8 on a trading bot, 4.2 and 4.3 on two short hourly jobs. All are older than 24 months, so none affects the current score, but all are visible.</fact>\n      <fact name=\"feedback_pattern\">One 3.8 review says the client would have rated higher had the risks been made clearer in the proposal. Treat this as the lesson for every new proposal: state limits and risks up front.</fact>\n      <fact name=\"catalog\">OpenClaw Security Audit (from 250 USD), OpenClaw Private Agent Deployment (from 950 USD), AI Launchpad Blueprint (from 119 USD, sold once at 159 USD)</fact>\n      <fact name=\"portfolio\">Marlow chatbot, BandBuddy.AI dashboard and landing page</fact>\n      <fact name=\"consultations\">Enabled. One 30-minute consultation sold at 30 USD in 2025 (no feedback, so it is excluded from Job Success).</fact>\n    </facts>\n    <problems>\n      <problem id=\"P1\" severity=\"critical\">\n        <what>The funnel is off.</what>\n        <fix>Availability badge on, answer the open invite, reactivate past clients, start the daily proposal routine.</fix>\n      </problem>\n      <problem id=\"P2\" severity=\"critical\">\n        <what>The 120 USD rate is four times your highest visible rate and above the ceiling of all but 9 Claude-title jobs on the marketplace.</what>\n        <fix>See rate_strategy. Keep your effective rate high through fixed-price packages; lower the sticker.</fix>\n      </problem>\n      <problem id=\"P3\" severity=\"high\">\n        <what>Title and catalog do not contain what buyers search for. Competitors who rank for this work put \"Claude Code\", \"n8n\", \"AI Agents\", \"MCP\" and \"Automation\" in the title.</what>\n        <fix>Use the title and catalog in positioning and offer_ladder.</fix>\n      </problem>\n      <problem id=\"P4\" severity=\"high\">\n        <what>Claims a client can check and may doubt: \"over 8 years of deep technical experience\" beside a 2017 to 2021 degree and employment from 2020; \"100% GxP/HIPAA compliance\".</what>\n        <fix>State only what the profile supports. Replace guarantees with named projects and results.</fix>\n      </problem>\n      <problem id=\"P5\" severity=\"medium\">\n        <what>Portfolio shows 2023 chatbot work. Nothing shows Claude, skills, MCP or agents.</what>\n        <fix>Three new case studies in week one.</fix>\n      </problem>\n      <problem id=\"P6\" severity=\"medium\">\n        <what>Five idle open contracts and five visible sub-5 ratings.</what>\n        <fix>Reactivate the open contracts (see job_success_protection). Use the Top Rated feedback-removal perk on the 3.8-rated 4,408 USD job if you are eligible; it is your largest visible rated contract.</fix>\n      </problem>\n      <problem id=\"P7\" severity=\"low\">\n        <what>Skills tags miss Claude Code, AI Agent Development, n8n, Automation, AI Implementation, AI Consulting, Business Process Automation.</what>\n        <fix>Add those the Upwork skill list accepts. Drop Systems Engineering and Gemini to make room.</fix>\n      </problem>\n    </problems>\n  </profile_audit>\n\n  <market_evidence>\n    <exact_marketplace_counts kind=\"observed\" date=\"2026-10-04\" filter=\"payment-verified clients, open jobs\">\n      <query term=\"title contains: claude\" total=\"313\">\n        <job_type hourly=\"215\" fixed=\"98\"/>\n        <hourly_ceiling at_least_50_usd=\"46\" at_least_100_usd=\"9\"/>\n        <fixed_budget under_100=\"40\" from_100_to_500=\"34\" from_500_to_1k=\"10\" from_1k_to_5k=\"9\" over_5k=\"5\"/>\n        <proposals fewer_than_5=\"9\" from_5_to_10=\"26\" from_10_to_15=\"33\" from_15_to_20=\"34\" from_20_to_50=\"102\" over_50=\"109\"/>\n        <client_history no_hires=\"49\" one_to_nine_hires=\"76\" ten_plus_hires=\"188\"/>\n        <experience entry=\"12\" intermediate=\"153\" expert=\"148\"/>\n        <pace>The 50 newest were all posted within 5 days: about 10 new jobs per day.</pace>\n        <reading>\n          60% of posters are experienced clients (10+ hires), but budgets are low and 67% of jobs already have 20 or more proposals.\n          Among the 46 jobs allowing 50 USD per hour or more, at least 28 had 50+ proposals and only 5 had fewer than 20.\n        </reading>\n      </query>\n      <query term=\"title contains: &quot;AI agent&quot;\" total=\"404\">\n        <job_type hourly=\"278\" fixed=\"126\"/>\n        <fixed_budget under_100=\"48\" from_100_to_500=\"37\" from_500_to_1k=\"17\" from_1k_to_5k=\"18\" over_5k=\"6\"/>\n        <proposals fewer_than_5=\"7\" from_5_to_10=\"14\" from_10_to_15=\"27\" from_15_to_20=\"32\" from_20_to_50=\"119\" over_50=\"205\"/>\n        <client_history no_hires=\"97\" one_to_nine_hires=\"116\" ten_plus_hires=\"191\"/>\n      </query>\n      <query term=\"title contains: n8n\" total=\"204\">\n        <job_type hourly=\"97\" fixed=\"107\"/>\n        <fixed_budget under_100=\"54\" from_100_to_500=\"30\" from_500_to_1k=\"7\" from_1k_to_5k=\"14\" over_5k=\"2\"/>\n        <client_history no_hires=\"54\" one_to_nine_hires=\"45\" ten_plus_hires=\"105\"/>\n      </query>\n      <query term=\"openclaw (anywhere in post)\" total=\"24\">\n        <reading>24 jobs across about two quarters, typical budget 50 to 1,000 USD.</reading>\n      </query>\n      <query term=\"&quot;MCP server&quot; with hourly ceiling 50+ or fixed 1,000+\" total=\"8\">\n        <reading>8 jobs in 2 months. MCP is a feature inside Claude and agent jobs, not a headline.</reading>\n      </query>\n      <query term=\"title contains: upwork, plus bidder / proposals / profile optimization\" total=\"50 to 100\">\n        <reading>About 20 new per week, many with fewer than 5 proposals, but most posters show 0 to 1K USD spend. A kit audience, not a high-ticket audience.</reading>\n      </query>\n    </exact_marketplace_counts>\n\n    <what_buyers_ask_for kind=\"observed\" note=\"from two full job posts\">\n      <job title=\"Claude AI Implementation Expert: Team Setup, Security, AI Agents and Business Workflows\" posted=\"4 days before\" proposals=\"50+\" interviewing=\"1\" connects=\"15\">\n        <scope>Plan and workspace setup with role permissions; security and data rules; a maintained business knowledge base; agents and workflows with human approval; operations and marketing insight workflows; team training and documentation.</scope>\n        <asks_in_proposal>Similar implementations with results; approach to security and permissions; the first three workflows you would automate; timeline, pricing and ongoing support.</asks_in_proposal>\n        <client>430K USD spent, 164 hires, 64% hire rate, rating 4.75 from 96 reviews, but average hourly rate paid 5.04 USD across 78,857 hours. Prefers Europe or Brazil.</client>\n        <lesson>Total spend is misleading. This client buys cheap labor. Average hourly rate paid is the number to check.</lesson>\n      </job>\n      <job title=\"AI Operations Auditor: Assess Our Claude-Based Business OS\" posted=\"2 days before\" proposals=\"50+\" interviewing=\"0\" connects=\"20\">\n        <scope>One written report: how the system compares, what is broken or missing, and a prioritized roadmap. Hourly at 30 to 40 USD, capped at 5 to 10 hours, possible follow-on work.</scope>\n        <asks_in_proposal>No generic letter. Open with one specific agent-based system you built and what happened, success or failure.</asks_in_proposal>\n        <client>245K USD spent, 24 hires, 60% hire rate, rating 4.99, average hourly rate paid 41.87 USD, mid-sized manufacturer.</client>\n        <lesson>A good client offering a small first engagement. This is the shape of work that turns into larger contracts.</lesson>\n      </job>\n    </what_buyers_ask_for>\n\n    <competitors kind=\"observed\" source=\"Upwork talent search, 'claude code implementation', Top Rated Plus, first page of 136\">\n      <freelancer location=\"India\" rate_usd=\"35\" earned=\"300K+\" title_style=\"AI Automation Engineer | Claude Code, MCP, n8n, AI Agents, RAG, Python\"/>\n      <freelancer location=\"Pakistan\" rate_usd=\"15\" earned=\"300K+\" title_style=\"AI Engineer | AI Agents, Automation, OpenAI, Claude and SaaS\"/>\n      <freelancer location=\"India\" rate_usd=\"22\" earned=\"200K+\" title_style=\"AI Agents and Automation | Claude Code | Lovable | Base44\"/>\n      <freelancer location=\"India\" rate_usd=\"10\" earned=\"300K+\" title_style=\"AI First Full-Stack Expert | n8n, Claude code\"/>\n      <freelancer location=\"Pakistan\" rate_usd=\"25\" earned=\"not shown\" title_style=\"Full-Stack AI Developer | Claude Code, MCP, n8n, AI Agents, RAG\"/>\n      <freelancer location=\"Italy\" rate_usd=\"100\" earned=\"100K+\" title_style=\"Outcome statement: builds AI-powered business tools that replace manual work\"/>\n      <freelancer location=\"Ireland\" rate_usd=\"95\" earned=\"70K+\" title_style=\"Anthropic Certified AI Automation Engineer | Claude Code, n8n and Agents\"/>\n      <freelancer location=\"Poland\" rate_usd=\"89.65\" earned=\"100K+\" title_style=\"AI and Business Automation | Claude, n8n, API, MCP | B2B Portals, CRMs\"/>\n      <reading>\n        The highest earners from South Asia list 10 to 35 USD per hour. The three at 90 to 100 USD per hour lead with a business outcome or a certification\n        rather than a technology list. You cannot out-earn the first group on volume at 120 USD; you can copy what the second group does.\n      </reading>\n    </competitors>\n\n    <proof_case kind=\"observed\" subject=\"Andrew W., Ireland, Top Rated Plus, public Upwork profile\">\n      <numbers>95 USD per hour, 70K+ USD earned, 105 jobs, 597 hours, 15 contracts in progress.</numbers>\n      <recent_contracts>Claude Code tutoring 220 USD fixed; automation build 500 USD fixed; Claude Code workflow audit 1,000 USD fixed; data assistant 1,200 USD fixed; sales app 1,700 USD fixed; agent system 1,522 USD at 55 USD per hour; marketing-agency automation 10,400 USD at 75 USD per hour over 139 hours.</recent_contracts>\n      <what_he_does>\n        <tactic>Leads with a certification and a client quote in the first two lines.</tactic>\n        <tactic>Offers a personalized recorded walkthrough of how he would automate one process the client names.</tactic>\n        <tactic>Sells small fixed jobs, audits and tutoring, then expands with the same client at an hourly rate.</tactic>\n        <tactic>Sells retainers for maintenance and a \"rescue\" service for broken automations.</tactic>\n        <tactic>States the buyer types he fits best, including data-residency cases.</tactic>\n      </what_he_does>\n      <why_it_matters>\n        His scale is close to yours (you: 35 jobs, 395 hours, 20K+). His history shows the small-job, audit, expansion, retainer path working on Upwork in 2026.\n        It does not prove you will get the same result: he is Top Rated Plus, Europe-based and certified.\n      </why_it_matters>\n    </proof_case>\n\n    <project_catalog_data kind=\"observed\">\n      <stat term=\"claude\">9,110 catalog projects</stat>\n      <stat term=\"ai agent\">13,277 catalog projects</stat>\n      <pattern>Leading listings start at 99 to 150 USD with 1 to 3 day delivery, from sellers showing 100 to 1,200+ reviews, with generic titles.</pattern>\n      <implication>Do not compete on price. List a specific outcome for a specific buyer at 299 USD and up.</implication>\n    </project_catalog_data>\n\n    <diy_market_data>\n      <gumroad kind=\"observed\" query=\"claude skills, sorted by best selling\">\n        <stat>815 products.</stat>\n        <stat>Among the top 36, most show no ratings; the highest count seen was 6. About a third are free.</stat>\n        <stat>Paid packs are listed at roughly 1,800 to 4,700 INR (very roughly 20 to 55 USD). One seller runs a monthly club at about 6,600 INR per month and a custom prompt-pack service at about 28,900 INR.</stat>\n        <reading>Sellers with traction give skills away as lead magnets and earn from a membership, a book or custom work. A paid pack alone has little visible traction.</reading>\n      </gumroad>\n      <cited source=\"S4\">SKILL.md marketplaces: top skills about 500 to 3,000 USD per month, median under 50 USD per month, most revenue in the top 10% of listings. Typical price 5 to 25 USD per skill.</cited>\n      <cited source=\"S5\">Gumroad revenue is top-heavy: the top 1% of products take about 77% of revenue. A curated n8n template pack raised its price from 15 to 100 USD after 194 sales.</cited>\n    </diy_market_data>\n\n    <external_evidence kind=\"cited\">\n      <point source=\"S1\">Upwork In-Demand Skills 2026: demand for skills that mention AI grew 109% year over year, against 23% for other skills. AI integration grew 178%; AI chatbot development 71%.</point>\n      <point source=\"S2\">Upwork launched its MCP server on 2026-08-10, free for all users.</point>\n      <point source=\"S3\">48 agencies that publish prices: a single workflow starts around 1,000 USD, a multi-workflow project around 3,556 USD, a retainer around 1,423 USD per month.</point>\n    </external_evidence>\n\n    <verdict>\n      <supported>Daily demand for Claude implementation, coaching and audit work, much of it from experienced Upwork clients.</supported>\n      <supported>A ladder of small fixed jobs leading to expansion and retainers; one comparable freelancer's public history shows it.</supported>\n      <not_supported>A 120 USD hourly sticker. Nine open Claude-title jobs allow it.</not_supported>\n      <not_supported>Large project budgets from cold proposals. Only 5 Claude-title and 6 AI-agent-title fixed jobs are over 5,000 USD, and they draw 50+ proposals.</not_supported>\n      <not_supported>Meaningful income from a paid skills pack without an audience.</not_supported>\n    </verdict>\n  </market_evidence>\n\n  <positioning>\n    <core_promise>I set up Claude so your team uses it every day: connected to your tools, with custom skills for your workflows, documented and handed over.</core_promise>\n    <target_buyers basis=\"my reading of the postings; test and adjust\">\n      <buyer>Small and mid-sized companies that already pay for Claude and want it wired into operations (the manufacturer and the marketing firm above are typical).</buyer>\n      <buyer>Agencies and professional-services firms: marketing, SEO, recruiting, accounting, legal.</buyer>\n      <buyer>Founders with a Claude Code-built product who need review, hardening or coaching.</buyer>\n    </target_buyers>\n    <new_title>Claude AI Implementation | Claude Code, Skills &amp; MCP | AI Agents &amp; n8n Automation</new_title>\n    <overview_structure>\n      <line order=\"1\">First two lines: who you help, the outcome, and proof. Example: \"I set up Claude for business teams: Claude Code, Cowork, custom skills and MCP connectors to your CRM, inbox and docs. Top Rated, 100% Job Success.\"</line>\n      <line order=\"2\">One short client quote from your own reviews.</line>\n      <line order=\"3\">An offer in the competitor's style that works: \"Message me one process you want automated and I will send a short recorded walkthrough of how I would build it.\"</line>\n      <line order=\"4\">Three packaged offers with scope and timeline.</line>\n      <line order=\"5\">Three proof bullets, each a real project with a number.</line>\n      <line order=\"6\">How you work: fixed scope, written acceptance criteria, stated risks and limits, recorded handover, 14 days of support.</line>\n      <remove>The \"8 years\" claim unless accurate and demonstrable; the compliance guarantee; the opening challenge to the reader; OpenClaw as a headline.</remove>\n    </overview_structure>\n    <specialized_profiles>\n      <profile name=\"AI Agent and Automation Development\">Build-heavy jobs: agents, RAG, n8n, API integration, scraping.</profile>\n      <profile name=\"AI Training and Coaching\">Coaching and training postings, where proposal counts were lowest.</profile>\n    </specialized_profiles>\n    <rate_strategy>\n      <rule>Set the profile rate to about 65 USD per hour now. That is twice your highest visible rate and inside the ceiling of the 46 better-paying Claude jobs. This number is my recommendation, not a measured optimum.</rule>\n      <rule>Earn your 120 USD per hour through packages: a 599 USD Setup Sprint delivered in 5 hours is 120 USD per hour without showing an hourly rate.</rule>\n      <rule>Move to 80, then 95 USD per hour after each set of three completed contracts at the current level. The proof case followed 55, then 75, then 95.</rule>\n      <rule>Never change the rate inside a running contract; open a new one (see job_success_protection).</rule>\n    </rate_strategy>\n    <certification_option kind=\"cited\" source=\"S11\">\n      Anthropic runs Claude certifications. The Claude Certified Architect Foundations exam costs 125 USD, but only people at organizations in the\n      Claude Partner Network can sit it. Check whether Revedor AI can join. A direct competitor leads his title with this certification.\n      Confirm the current rules on Anthropic's partner site before planning around it.\n    </certification_option>\n  </positioning>\n\n  <offer_ladder>\n    <principle>One body of work, sold three ways. The DIY kit is the same skills, templates and documents you use to deliver done-for-you work.</principle>\n    <pricing_note>Entry prices sit above 251 USD and team prices above 1,001 USD on purpose: those are the thresholds where Upwork gives a successful job more weight in your Job Success Score.</pricing_note>\n\n    <done_for_you>\n      <offer id=\"DFY1\" name=\"Claude Setup Sprint\" price=\"299 / 599 / 1,200 USD fixed\" delivery=\"2 to 3 days\" channel=\"Project Catalog, proposals, past clients\">\n        <scope>Starter 299: setup plus 1 custom skill. Standard 599: setup, 3 skills, 1 connector, recorded training. Team 1,200: up to 5 users, 5 skills, 3 connectors, permissions guide.</scope>\n        <role>Door-opener and the offer for past-client reactivation.</role>\n      </offer>\n      <offer id=\"DFY2\" name=\"AI Operations Audit\" price=\"750 to 1,500 USD fixed\" delivery=\"3 to 5 days\">\n        <scope>Review a Claude or agent setup, or a Claude Code-built app. One written report: findings, risks, quick wins, prioritized roadmap with costs.</scope>\n        <role>Paid discovery before any large build. Matches the auditor job post and the proof case's 1,000 USD audit.</role>\n      </offer>\n      <offer id=\"DFY3\" name=\"Done-For-You Claude Implementation\" price=\"3,000 to 7,500 USD in 3 milestones\" delivery=\"2 to 4 weeks\">\n        <scope>Mirror the implementation job post: plan and workspace setup with role permissions, security and data rules, business knowledge base, 3 to 5 agents or workflows with human approval, team training, documentation, 14 days of support.</scope>\n        <role>Sold only to clients who have completed DFY1 or DFY2 with you.</role>\n      </offer>\n      <offer id=\"DFY4\" name=\"AI Operations Care Plan\" price=\"1,000 to 2,500 USD per month\">\n        <scope>Fixed monthly hours for new skills, fixes and updates, plus a monthly review call.</scope>\n        <role>Recurring income. Each 90-day period with a payment counts as an extra successful job, up to 8.</role>\n      </offer>\n      <offer id=\"DFY5\" name=\"Claude Coaching and Team Training\" price=\"65 to 95 USD per hour, or 750 USD per workshop\" channel=\"Consultations, proposals\"/>\n      <offer id=\"DFY6\" name=\"Automation Rescue\" price=\"499 to 1,500 USD fixed\">\n        <scope>Diagnose and fix a broken Claude Code build, agent or n8n workflow that someone else made.</scope>\n        <role>Urgent need, less price-sensitive buyers. Postings such as the pre-launch code review and the agent \"stabilise and harden\" job fit this.</role>\n      </offer>\n    </done_for_you>\n\n    <do_it_yourself>\n      <product id=\"DIY1\" name=\"Claude Business OS Kit\">\n        <contents>\n          <item>12 to 20 SKILL.md skills for business operations, each encoding one specific workflow: inbox triage, meeting notes to CRM, proposal drafting, client reporting, invoice chasing, research briefs, SOP writer.</item>\n          <item>CLAUDE.md and project-instruction templates for teams, plus a permissions and data-rules guide.</item>\n          <item>Connector setup guides for tools named in the job posts: HubSpot, Google Workspace, ClickUp, Notion, Slack, GoHighLevel, Zoho, QuickBooks.</item>\n          <item>A role-based prompt library and short walkthrough videos.</item>\n        </contents>\n        <pricing>Free sample of 5 skills. Full kit 49 USD. Kit plus videos and guides 149 USD. Kit plus a 30-minute setup call 299 USD.</pricing>\n      </product>\n      <product id=\"DIY2\" name=\"Upwork MCP Proposal Engine Kit\" price=\"29 to 79 USD\">\n        <contents>The documentation in this repository turned into skills: job discovery, client vetting with the scorecard below, proposal drafting and Connects budgeting through the official Upwork MCP, with confirmation on every submission.</contents>\n        <compliance>Sell setup and templates for the buyer's own account. Never bid from another person's account and never sell unattended auto-bidding.</compliance>\n      </product>\n      <channels>\n        <off_upwork>Free sample skills in a public GitHub repository (your GitHub is already linked on the profile), LinkedIn posts with short demos, then Gumroad or Lemon Squeezy for the paid kit and one SKILL.md marketplace.</off_upwork>\n        <on_upwork>Only as a customized service in Project Catalog. No store links in proposals, messages or the profile.</on_upwork>\n        <hard_rule source=\"S8\">A client found on Upwork pays through Upwork for 24 months unless the conversion fee is paid. Do not share contact details before a contract starts.</hard_rule>\n      </channels>\n      <realistic_expectation kind=\"assumption\">0 to 300 USD per month from kits in the first two months. The kit earns its keep by cutting delivery time and serving as proof.</realistic_expectation>\n    </do_it_yourself>\n  </offer_ladder>\n\n  <seven_day_launch>\n    <budget>About 80 to 110 USD: Freelancer Plus (confirm current terms on your upgrade page) and 400 to 600 Connects at 0.15 USD each. At 15 to 20 Connects per proposal, your 110 Connects cover 5 to 7 proposals.</budget>\n    <day number=\"1\" theme=\"Switch the funnel on\">\n      <task>Rewrite title, overview and skills. Set the rate to 65 USD per hour.</task>\n      <task>Turn on the availability badge. Answer or decline the 2026-08-31 invitation (0 Connects).</task>\n      <task>Reconnect the Upwork MCP under your own login: claude mcp add --transport http upwork https://mcp.upwork.com/mcp, then run /mcp to log in.</task>\n    </day>\n    <day number=\"2\" theme=\"Proof\">\n      <task>Publish three portfolio case studies: the Upwork MCP documentation and proposal engine in this repository; a Claude skills and connector setup run on your own company as a live demo; your strongest agent or data-pipeline build.</task>\n      <task>Record one 2-minute demo of Claude running a business workflow end to end. Reuse it everywhere.</task>\n    </day>\n    <day number=\"3\" theme=\"Past clients first\">\n      <task>Message the five clients with open contracts and the past clients who rated you 5.0, through their existing Upwork rooms, with the Setup Sprint offer. Start with the enterprise client that has hired you at least six times.</task>\n      <task>For any open contract where the client does not want more work, ask them to close it and leave feedback.</task>\n      <task>Replace the two OpenClaw catalog projects with Claude Setup Sprint and AI Operations Audit.</task>\n    </day>\n    <day number=\"4-7\" theme=\"Daily proposal routine\">\n      <task>3 to 5 vetted proposals per day in the 18:30 to 23:30 IST window. Only jobs under 15 proposals, under 24 hours old, passing the scorecard. Across Claude, AI-agent and n8n titles that pool was about 140 jobs on 2026-10-04 before vetting.</task>\n      <task>Build the first 5 skills of the kit and publish them as the free sample.</task>\n    </day>\n    <first_week_cash_reality kind=\"cited\" source=\"S12\">\n      After a client releases a fixed-price milestone, Upwork holds the funds for 5 days. Hourly work is billed weekly and becomes available about 10 days later.\n      A milestone approved on day 6 pays out around day 11. Confirm the schedule in your Upwork payment settings.\n    </first_week_cash_reality>\n  </seven_day_launch>\n\n  <targets kind=\"assumption\">\n    <note>Planning numbers to measure against. Not forecasts.</note>\n    <week number=\"1\">15 to 20 proposals, all past clients contacted, 1 to 2 contracts signed, 300 to 1,500 USD contracted.</week>\n    <month number=\"1\">3 to 5 Setup Sprints or audits, 1 implementation started: 2,500 to 7,000 USD contracted.</month>\n    <month number=\"3\">1 to 2 retainers, rate at 80 USD per hour, 5,000 to 10,000 USD per month.</month>\n    <checkpoints basis=\"my rules of thumb\">\n      <check>After 20 proposals, if fewer than 6 were viewed: change targeting and the first two lines.</check>\n      <check>Viewed but no replies: test the Audit as the entry offer, or lower the first milestone.</check>\n      <check>Calls that do not close: tighten scope and state risks earlier.</check>\n      <check>Track weekly on My Stats: proposals sent, viewed, interviews, hires, profile views, invites.</check>\n    </checkpoints>\n  </targets>\n\n  <job_success_protection>\n    <how_jss_works kind=\"observed\" source=\"your Job Success insights page, plus S7\">\n      <rule>Calculated daily over 6, 12 and 24 months; the best is shown. Only jobs in the last 24 months count.</rule>\n      <rule>Two parts decide client satisfaction: public star feedback and the private contract-ending reason. Both must be positive.</rule>\n      <rule>Weighting by earnings: 1 USD or more counts as 1 job, 251 USD or more as 1.25 jobs, 1,001 USD or more as 1.5 jobs.</rule>\n      <rule>Long-term relationship: if a client's latest payment is more than 90 days after their first, all ongoing and completed jobs with that client count as successful, even without feedback.</rule>\n      <rule>Contract length: each 90-day period with a payment on one contract counts as an extra job, up to 8.</rule>\n      <rule>Excluded: jobs with no earnings, jobs with no feedback, jobs with feedback removed. Conditions apply.</rule>\n      <rule>You need more than 2 eligible jobs in 24 months to keep a score. You have 8.</rule>\n      <rule>Contracts with rate changes can weigh more in either direction. Feedback from clients Upwork has flagged does not count against you (S7).</rule>\n      <rule>Top Rated perk: remove one outcome from the calculation once every 10 contracts and 3 months (S13, community source; confirm on your perks page).</rule>\n    </how_jss_works>\n    <your_position>\n      <illustration kind=\"assumption\">\n        Upwork does not publish the formula. As a rough picture: 8 eligible jobs at an average weight of 1.25 is 10 weighted jobs. One failed job over 1,001 USD adds 1.5 on the\n        negative side: 10 out of 11.5 is about 87%, below the 90% Top Rated line. Add six successful jobs of 251 USD or more first (7.5 more weight) and the same failure leaves about 92%.\n      </illustration>\n      <conclusion>Stack several small successes before taking a large build with a new client. The weighting makes a 299 USD success worth almost as much as a 5,000 USD one.</conclusion>\n    </your_position>\n    <fastest_safe_gains>\n      <gain>Any new payment from a client whose first payment was over 90 days ago turns that relationship into a long-term success. Your five open contracts from 2023 and 2024 and your repeat enterprise client all qualify. This is my reading of the insights page; confirm with one client first.</gain>\n      <gain>A retainer adds one successful job every 90 days by itself.</gain>\n      <gain>Jobs closed without feedback are excluded rather than counted against you, so a quiet close is neutral. A pattern of them is not something to rely on.</gain>\n    </fastest_safe_gains>\n    <client_scorecard use=\"before spending Connects; all visible on the job page or through MCP find_jobs action=get\">\n      <must_pass>Payment verified.</must_pass>\n      <must_pass>Average hourly rate paid of 25 USD or more for clients with history. Live example: a client with 430K USD spent pays an average of 5.04 USD per hour.</must_pass>\n      <must_pass>Client rating 4.7 or higher, or a new client with a specific, detailed post.</must_pass>\n      <must_pass>Hire rate 50% or higher.</must_pass>\n      <must_pass>Read the feedback this client gave other freelancers. Regular 4.0 to 4.5 ratings with complaints means skip.</must_pass>\n      <must_pass>Nobody hired yet, under 15 proposals, and you meet any stated location preference.</must_pass>\n      <red_flag>Tiny budget with large scope and urgency. Live example: 100 USD fixed to finish a full marketplace in 7 days, asking for perfection and \"your very best price\".</red_flag>\n      <red_flag>Lowest-bid language, unpaid tests, requests to talk or pay outside Upwork, commission-only pay.</red_flag>\n      <red_flag>Scope that cannot be written as acceptance criteria. Three of your five sub-5 ratings came from work where feasibility was uncertain (AutoGPT plugin, trading bot, complex plugin).</red_flag>\n      <note>A placeholder budget from a client with a healthy average hourly rate is fine. Quote your real price.</note>\n    </client_scorecard>\n    <contract_rules>\n      <rule>First contract with a new client is a Setup Sprint or Audit. The large build comes after it ends well.</rule>\n      <rule>State risks and limits in the proposal and again in the first contract message, with acceptance criteria and two revision rounds.</rule>\n      <rule>Keep the rate fixed inside a contract. New rate, new contract.</rule>\n      <rule>Hourly work goes through the Upwork time tracker so payment protection applies.</rule>\n      <rule>Written update twice a week; recorded demo at each milestone; use Upwork's mid-contract feedback request on longer work.</rule>\n      <rule>Before closing, ask what would stop a 10 out of 10 and fix it. Then ask the client to close and leave feedback.</rule>\n      <rule>If a client is unhappy, fix first. A refund does not by itself remove the outcome; read S7 before refunding.</rule>\n      <rule>All payment for Upwork-sourced clients stays on Upwork (S8).</rule>\n    </contract_rules>\n  </job_success_protection>\n\n  <mcp_operating_system reference=\"UPWORK_MCP_DOCUMENTATION.xml stages 1 to 5; official page S14\">\n    <account_warning>\n      The Upwork connector in the Claude session used to prepare this plan is authorized to a different Upwork account (shown as \"Patrick H.\"), not Aryan P.\n      Connect your own account before any MCP step. No change was made to any Upwork account while preparing this plan.\n    </account_warning>\n    <official_capabilities kind=\"observed\" source=\"S14\">\n      <item>Freelancer: dashboard summary, job search and recommendations, proposal drafts, invitations and offers, contracts and milestone submission, earnings, messaging, attachments, availability badge and profile boost, profile updates (availability, employment, languages, education, portfolio).</item>\n      <item>Every write action is a draft you confirm. Connects are spent only when you confirm. Binding actions finish on upwork.com.</item>\n    </official_capabilities>\n    <daily_routine runs=\"2 to 3 times in the evening IST window\">\n      <step number=\"1\" tool=\"find_jobs\">smart_search mode=most_recent days_posted=1 verified_payment_only=true; then search with title \"claude\", \"AI agent\", \"n8n\", proposals_max=15, client_hires_min=1, sort=recency.</step>\n      <step number=\"2\" tool=\"find_jobs\" action=\"get\">Score against the scorecard using client_record, activityStat.jobActivity, preferred_qualifications and client_feedback.</step>\n      <step number=\"3\" tool=\"list_freelancer_proposals\">Check invitations and existing proposals to avoid error VJ-JA-10.</step>\n      <step number=\"4\" tool=\"manage_proposals\" action=\"create\">Draft with the template below, attach the matching portfolio item, boost only when the preview recommends it.</step>\n      <step number=\"5\" tool=\"confirm_preview\">You read the draft, the Connects cost and the bid, then confirm.</step>\n    </daily_routine>\n    <proposal_template>\n      <line order=\"1\">One specific system you built and what happened, in two sentences. The auditor post asks for exactly this, and it answers the post's real question.</line>\n      <line order=\"2\">The first three workflows you would look at for this client, named from their post.</line>\n      <line order=\"3\">One stated risk or limit and how you handle it.</line>\n      <line order=\"4\">A fixed first milestone with price a
